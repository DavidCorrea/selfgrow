name: ci

# The pipeline's own gate. Everything else in .github/workflows/ is an agent that
# runs on a schedule and spends requests; this one runs on changes to the harness
# and spends nothing.
#
# It exists because agents/ was unlinted and untested while the code inside it
# refused to merge a product that didn't carry its own checks. A typo in
# shared.mjs was caught by a 3am cron run failing, which is both the slowest and
# the most expensive place to find one.
# Runs on EVERY pull request, with no path filter. That is deliberate and it is
# not about thoroughness: a required status check that does not run on some paths
# leaves those pull requests waiting forever for a check that will never report.
# Lint and the suite take seconds; the product verify pays for a browser, and is
# worth it as the only ENFORCED copy of the gate the agents apply to themselves.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The harness: does the pipeline's own code hold together.
  check:
    runs-on: ubuntu-latest
    # No model, no browser, no secrets — just node. Should finish in well under a
    # minute; the timeout is only here so a hung install can't sit for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm test

  # The product: the same four layers the Devs run before merging — syntax, lint,
  # a real page load, and the product's own checks().
  #
  # The agents already run this in-process and merge on the result, which makes
  # every guarantee in the pipeline self-imposed: a swallowed error, an early
  # return, or a future edit that reorders the steps would skip it and nothing
  # would notice. This is the copy that a ruleset can require, so the gate stops
  # depending on the agents choosing to honour it.
  verify-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - name: Verify the built product
        run: node agents/verify-product.mjs

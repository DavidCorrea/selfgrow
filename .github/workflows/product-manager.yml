name: product-manager

on:
  schedule:
    # Daily, and the single entry point for the day's work: groom the backlog,
    # then kick the Builder via workflow_run. Deliberately just after OpenRouter's
    # free-tier cap resets at 00:00 UTC, so the chain runs against a full day's
    # request allowance rather than whatever a previous run left behind.
    - cron: '30 0 * * *'
  workflow_dispatch:
  issues:
    # Triage inbound issues. The job guard below skips the agent's own creations.
    types: [opened, reopened]
  # NOTE: deliberately NOT triggered by the Product Owner. Re-grooming the instant
  # the vision changes cost a whole extra PM+Builder chain every week, and the
  # vision is a slow-moving north star — the next daily run picks it up within
  # hours, which is soon enough for a weekly edit.

permissions:
  contents: read
  issues: write

# Creating a batch of tickets fires one issues.opened event per ticket, each
# spinning up another product-manager run (guard-skipped, but it still completes
# and so still kicks builder-team via workflow_run). Collapse that burst into a
# single run. cancel-in-progress: false so a self-fired run never aborts an
# in-flight grooming run — the redundant pending runs just supersede each other.
concurrency:
  group: product-manager
  cancel-in-progress: false

jobs:
  groom-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on cron/dispatch; on issues only when NOT the agent's own creation
    # (else the PM loops on itself, and each loop costs model requests).
    if: >-
      ${{
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        || (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'agent'))
      }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is needed to screenshot the app for the visual check.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (app review — measures the live app)
        run: npx playwright install --with-deps chromium

      - name: Run Product Manager agent
        run: node agents/product-manager.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Grooming is 1 model call, plus 1 for the semantic dedup pass. The
          # allowance covers a couple of chain fallbacks and no more — the day's
          # requests belong to the Builder.
          MODEL_REQUEST_BUDGET: '6'
          # PAT carries `project` scope (board) and covers issue creation.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

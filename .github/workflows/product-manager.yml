name: product-manager

on:
  schedule:
    # Daily, and the single entry point for the day's work: groom the backlog,
    # then kick the Builder via workflow_run. Deliberately just after OpenRouter's
    # free-tier cap resets at 00:00 UTC, so the chain runs against a full day's
    # request allowance rather than whatever a previous run left behind.
    - cron: '30 0 * * *'
  workflow_dispatch:
  # NOTE: deliberately NOT triggered by `issues`. Grooming CREATES issues, so an
  # issues.opened trigger made the PM trigger itself once per ticket: an 8-ticket
  # run spawned 8 more PM runs. A job-level `if` guard skipped the work but could
  # not stop the runs existing, and a skipped run still *completes*, which used to
  # kick the Builder anyway. Inbound human issues are picked up by the next daily
  # run instead.
  #
  # Also deliberately NOT triggered by the Product Owner: re-grooming the instant
  # the vision changes cost a whole extra chain every week, and the vision is a
  # slow-moving north star.

permissions:
  contents: read
  issues: write

# Never groom twice at once: two concurrent runs would dedup their proposals
# against a board neither has finished writing to, and create the same tickets
# twice. cancel-in-progress: false so a manual dispatch queues behind an
# in-flight run rather than aborting it mid-write.
concurrency:
  group: product-manager
  cancel-in-progress: false

jobs:
  groom-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is needed to screenshot the app for the visual check.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (app review — measures the live app)
        run: npx playwright install --with-deps chromium

      - name: Run Product Manager agent
        run: node agents/product-manager.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Grooming is 2 model calls, so most of this is slack for chain
          # fallbacks and retries. Part of a ~1000/day account limit shared with
          # the Builder (250 x 3 slots) and the weekly agents (50 each) — the
          # day's requests still belong to the Builder, the only agent shipping code.
          MODEL_REQUEST_BUDGET: '100'
          # PAT carries `project` scope (board) and covers issue creation.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

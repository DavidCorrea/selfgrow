name: scribe

on:
  schedule:
    # Weekly — refresh the wiki narrative as the garden grows. On Thursday rather
    # than Monday so it doesn't share a day (and a request budget) with the
    # Product Owner run.
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Scribe agent
        run: node agents/scribe.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # One narrative refresh per week. Part of a ~250/day ceiling shared with
          # the Builder (180), PM (30) and PO (10).
          MODEL_REQUEST_BUDGET: '10'
          # PAT used for `gh repo view` and to clone/push the wiki repo.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}

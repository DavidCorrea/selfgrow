name: scribe

on:
  schedule:
    # Weekly — refresh the wiki narrative as the garden grows. On Thursday rather
    # than Monday so it doesn't share a day (and a request budget) with the
    # Product Owner run.
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    # Sized so the agent stops ITSELF first. MAX_SESSION_MINUTES (12) bounds a
    # session, this run makes one session, and setup is a few minutes on top — so the
    # runner's axe is the last resort, not the usual stop. The Product Owner was
    # killed at 20 minutes on 2026-07-27, losing the session and its whole spend.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Run Scribe agent
        run: node agents/scribe.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # One narrative refresh per week. This run's own allowance, in REAL
          # requests (one per agent turn), not sessions — see isRequestBudgetSpent.
          #
          # The account's 1000/day cap is enforced elsewhere: the shared ledger in
          # shared.mjs, read before the first call and written after every session,
          # so this run sees what the Builder (600) and the PM (100) already spent.
          # A session that runs away is stopped by MAX_SESSION_TURNS, not by this.
          MODEL_REQUEST_BUDGET: '150'
          # PAT used for `gh repo view` and to clone/push the wiki repo.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}

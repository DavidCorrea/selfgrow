name: curator

on:
  schedule:
    # Weekly, and on a day of its own. Curation is the slowest-moving judgement in
    # the pipeline — a week of shipping is the smallest amount of change worth
    # re-reading the whole collection over.
    - cron: '0 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One curator at a time: two concurrent runs would read the same collection and
# propose the same removals twice.
concurrency:
  group: curator
  cancel-in-progress: false

jobs:
  review-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Run Curator agent
        run: node agents/curator.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # One judgement per week over the whole language. This run's own
          # allowance, in REAL requests (one per agent turn), not sessions.
          #
          # The account's 1000/day cap is enforced elsewhere: the shared ledger in
          # shared.mjs, read before the first call and written after every session,
          # so this run sees what the Builder (600) and the PM (100) already spent.
          # A session that runs away is stopped by MAX_SESSION_TURNS, not by this.
          MODEL_REQUEST_BUDGET: '150'
          # PAT carries `project` scope (board) and covers issue creation.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

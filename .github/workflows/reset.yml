name: reset

# Run manually, with the other workflows paused: cancels pending runs, closes all
# open issues, milestones and agent PRs, clears the board, resets the wiki's memory
# pages, archives the product's Discussions memory, and deletes the previous product — on a reset/ branch, landed on main through a pull
# request once the required checks pass, because main's ruleset takes nothing else.
#
# Every other workflow here is additive — this is the one that dismantles. It used
# to fire on a bare dispatch, so two clicks in the Actions UI closed every issue
# and deleted the product, with the button sitting in the same list as the six
# harmless ones. The confirmation below is the whole difference between choosing
# that and reaching for it.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the repository name (selfgrow) to confirm. Everything below is destructive.'
        required: true
        type: string

# Wider than the rest of the pipeline because this job is the one that dismantles
# it: contents to push the deletion's branch, actions to cancel the runs
# that would otherwise race the reset, pull-requests to close abandoned agent PRs
# and to open and merge the deletion's.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  reset:
    runs-on: ubuntu-latest
    # The GitHub-side steps take a few minutes; landing the deletion then waits
    # up to mergePR's ten minutes for `check` and `verify-product`, the second of
    # which installs a browser. Thirty leaves room for a queued runner, so the job
    # reaches its own "not done" report instead of being killed mid-wait.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitExec pushes with GIT_TOKEN below; nothing is left on disk.
          persist-credentials: false

      - uses: ./.github/actions/setup

      # No model runs here, but agents/secrets.mjs refuses a secret in the
      # environment on every CI run.
      - uses: ./.github/actions/secrets
        with:
          gh-token: ${{ secrets.AGENT_PAT }}
          # The PAT, not GITHUB_TOKEN, pushes the deletion's branch and (as
          # gh-token) opens its PR: GitHub starts no workflows for events made by
          # GITHUB_TOKEN, so the required checks would never run and the PR could
          # never merge. See the note on Pull Requests in shared.mjs.
          git-token: ${{ secrets.AGENT_PAT }}

      - name: Reset GitHub state
        run: node agents/reset.mjs
        env:
          # Checked in reset.mjs before anything destructive runs, rather than
          # here, so running the script by hand is guarded too.
          RESET_CONFIRM: ${{ inputs.confirm }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

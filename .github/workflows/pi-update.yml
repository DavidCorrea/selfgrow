name: pi-update

on:
  schedule:
    # Tuesday. Deliberately a day no other weekly agent runs — the Product Owner
    # is Monday, the Playtester Wednesday, the Tech Lead Thursday — so the probes
    # below never compete with a grooming or building run for the day's requests.
    - cron: '0 7 * * 2'
  workflow_dispatch:

  # The free gate below, on any PR that could invalidate the chain — a pi bump
  # (including one Dependabot opened), an edit to the chain, or a change to the
  # code that resolves it.
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'agents/models.json'
      - 'agents/shared.mjs'
      - 'agents/model-check.mjs'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    # Never on a PR — that event only wants the free `check` job below.
    if: github.event_name != 'pull_request'
    # It pushes a branch and merges to main, so it takes the same lock as the
    # Devs: a Builder mid-merge and a dependency bump racing on main is what this
    # group exists to prevent. On this job only, not the workflow — the read-only
    # `check` gate runs on every dependency PR, and holding the writer lock there
    # queued it behind a whole Devs run and could bump a pending Devs run out.
    concurrency:
      group: agent-main-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # npm install, a registry assertion, and a PR. No model calls at all.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needs real history: it branches from origin/main and merges back.
          fetch-depth: 0
          # It pushes with GIT_TOKEN below, so no token is left on disk for the
          # packages `npm install` runs to find.
          persist-credentials: false

      # No Chromium: nothing here opens a browser.
      - uses: ./.github/actions/setup

      # Never as the node step's env — see the action.
      - uses: ./.github/actions/secrets
        with:
          # No model calls: the chain is asserted against pi's BUNDLED registry, so
          # this job needs no OpenRouter key at all. It used to probe candidate
          # models live, which is what the key was for.
          gh-token: ${{ secrets.AGENT_PAT }}
          bot-token: ${{ secrets.GITHUB_TOKEN }}
          # The PAT, because this job pushes a branch and opens a PR on it. A push
          # made with GITHUB_TOKEN triggers no workflows, so the PR's required
          # checks would never start and it could never merge. See devs.yml.
          git-token: ${{ secrets.AGENT_PAT }}

      - name: Bump pi and re-check the model chain
        run: node agents/pi-update.mjs
        env:
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

  # The free half, as a gate: assert the chain on every PR that touches the
  # dependency or the chain itself, including Dependabot's own bumps. Costs no
  # requests and needs no API key, so it can run unconditionally.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Assert the model chain against the installed pi
        run: node agents/model-check.mjs

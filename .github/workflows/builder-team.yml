name: builder-team

on:
  # Every four hours, on top of the Product Manager's dispatch. A cron used to be
  # ruled out as a duplicate of that chain that would cost a full day's request
  # allowance, but measured runs spend ~7 requests per slot, not the 250 ceiling,
  # and a cron that finds nothing buildable costs ZERO model requests: the plan job
  # below is pure gh API, and build-ticket doesn't run at all when count is 0. So a
  # redundant firing is free and a productive one is cheap. Six firings a day cannot
  # exceed 540 requests even at the budget ceiling (see MODEL_REQUEST_BUDGET).
  schedule:
    - cron: '0 */4 * * *'

  # The Product Manager also dispatches this explicitly at the end of a run that
  # actually left buildable work (see kickBuilder in product-manager.mjs), so newly
  # groomed tickets start building immediately instead of waiting for the next tick.
  #
  # It used to trigger on `workflow_run` from product-manager, which fires when a
  # PM run COMPLETES — including runs whose job was skipped by a guard, and
  # including every run in a self-triggered burst. One grooming pass that created
  # 8 tickets produced 9 Builder runs. "The PM finished" and "there is work to
  # build" are different facts, and only the PM knows the second one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize every workflow that writes to main (builder-team + product-owner)
# so concurrent runs never race on branches or the push to main.
concurrency:
  group: agent-main-writer
  cancel-in-progress: false

jobs:
  # One reader decides who builds what. Nothing claims a ticket, so nothing can
  # race for one — see agents/plan-build.mjs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.assign.outputs.matrix }}
      count: ${{ steps.assign.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign tickets to slots
        id: assign
        run: node agents/plan-build.mjs
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          # Three slots. Every extra one is another branch that may touch the same
          # file, and the per-slot request budget multiplies by this number.
          PARALLEL_BUILDERS: '3'

  build-ticket:
    needs: plan
    # Nothing buildable means no jobs at all, rather than a slot that spins up a
    # runner, installs Chromium and finds nothing to do.
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One slot failing must not cancel its siblings: their work is unrelated by
      # construction, and a cancelled builder can leave a branch and an open PR.
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: build #${{ matrix.ticket }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required for fetch/merge/rebase against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (runtime verify)
        run: npx playwright install --with-deps chromium

      - name: Run Builder Team agents
        run: node agents/builder-team.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # PER SLOT, PER RUN — and now there are up to 7 runs a day (6 cron
          # firings plus the PM's dispatch), so the multiplier is slots x runs:
          # 30 x 3 x 7 = 630 worst case, which with the PM's 100 and one weekly
          # agent (50) leaves room under the account's 1000/day. It was 250 back
          # when only one run existed per day; at that size a single pathological
          # run (retry loops, merge conflicts) could eat the whole day, so the
          # ceiling protected nothing. 30 is still ~4x what a real slot spends.
          # Raising PARALLEL_BUILDERS or the cron frequency without lowering this
          # multiplies the spend — the product is what matters, not the number here.
          # Checked between tickets, so a ticket already in flight still finishes.
          MODEL_REQUEST_BUDGET: '30'
          # Sized to the request budget above, and kept well inside both the job's
          # 120-minute timeout and the 4-hour cron interval so a slot can never
          # still be running when its successor fires (concurrency would queue it).
          BUILD_RUN_BUDGET_MINUTES: '60'
          # This slot's ticket, assigned by the plan job. The Builder narrows to
          # exactly this ticket so it cannot wander onto a sibling slot's work.
          TICKET_NUMBER: ${{ matrix.ticket }}
          # AGENT_PAT (= the user) is the default token: Projects, issues, and
          # approving/merging the PR. BOT_TOKEN (= github-actions[bot]) opens the
          # PR as a DIFFERENT identity, so the PAT can legitimately approve it.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

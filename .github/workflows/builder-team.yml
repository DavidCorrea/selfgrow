name: builder-team

on:
  # No cron. The Builder has exactly one automatic entry point: product-manager's
  # daily run grooms the backlog and kicks it via workflow_run below. A cron here
  # would fire IN ADDITION to that chain on the same day, and since the free tier
  # caps REQUESTS per day, a duplicate Builder run costs a full day's allowance to
  # redo work the chain already did. A broken chain self-heals at the next daily
  # PM run; use workflow_dispatch to recover sooner.
  workflow_dispatch:
  # Kicked off after the Product Manager finishes grooming/prioritizing the backlog.
  # (Builder is deliberately NOT triggered by issue events.)
  workflow_run:
    workflows: ["product-manager"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize every workflow that writes to main (builder-team + product-owner)
# so concurrent runs never race on branches or the push to main.
concurrency:
  group: agent-main-writer
  cancel-in-progress: false

jobs:
  build-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # When kicked by the PM, only run if the PM actually completed successfully
    # (skip the guarded-off agent-issue runs).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required for fetch/merge/rebase against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (runtime verify)
        run: npx playwright install --with-deps chromium

      - name: Run Builder Team agents
        run: node agents/builder-team.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The Builder is where the day's requests should go — it is the only
          # agent that ships code. Sized against a ~250/day ceiling shared with
          # the other agents (PM 30 + PO 10 + Scribe 10), so the worst single day
          # lands near 220 and leaves headroom for a retry storm.
          # Checked between tickets, so a ticket already in flight still finishes.
          #
          # At this size the binding constraint is no longer requests but
          # wall-clock: BUILD_RUN_BUDGET_MINUTES (45) inside a 60-minute job
          # timeout. That is deliberate — time and quality are healthier limits
          # than a quota, and this budget is now a runaway backstop, not a diet.
          MODEL_REQUEST_BUDGET: '180'
          # AGENT_PAT (= the user) is the default token: Projects, issues, and
          # approving/merging the PR. BOT_TOKEN (= github-actions[bot]) opens the
          # PR as a DIFFERENT identity, so the PAT can legitimately approve it.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

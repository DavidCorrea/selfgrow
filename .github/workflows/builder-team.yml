name: builder-team

on:
  # No cron. The Builder has exactly one automatic entry point: product-manager's
  # daily run grooms the backlog and kicks it via workflow_run below. A cron here
  # would fire IN ADDITION to that chain on the same day, and since the free tier
  # caps REQUESTS per day, a duplicate Builder run costs a full day's allowance to
  # redo work the chain already did. A broken chain self-heals at the next daily
  # PM run; use workflow_dispatch to recover sooner.
  # workflow_dispatch is the ONLY trigger. The Product Manager dispatches this
  # explicitly at the end of a run that actually left buildable work (see
  # kickBuilder in product-manager.mjs).
  #
  # It used to trigger on `workflow_run` from product-manager, which fires when a
  # PM run COMPLETES — including runs whose job was skipped by a guard, and
  # including every run in a self-triggered burst. One grooming pass that created
  # 8 tickets produced 9 Builder runs. "The PM finished" and "there is work to
  # build" are different facts, and only the PM knows the second one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize every workflow that writes to main (builder-team + product-owner)
# so concurrent runs never race on branches or the push to main.
concurrency:
  group: agent-main-writer
  cancel-in-progress: false

jobs:
  # One reader decides who builds what. Nothing claims a ticket, so nothing can
  # race for one — see agents/plan-build.mjs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.assign.outputs.matrix }}
      count: ${{ steps.assign.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign tickets to slots
        id: assign
        run: node agents/plan-build.mjs
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          # Three slots. Every extra one is another branch that may touch the same
          # file, and the per-slot request budget multiplies by this number.
          PARALLEL_BUILDERS: '3'

  build-ticket:
    needs: plan
    # Nothing buildable means no jobs at all, rather than a slot that spins up a
    # runner, installs Chromium and finds nothing to do.
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One slot failing must not cancel its siblings: their work is unrelated by
      # construction, and a cancelled builder can leave a branch and an open PR.
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: build #${{ matrix.ticket }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required for fetch/merge/rebase against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (runtime verify)
        run: npx playwright install --with-deps chromium

      - name: Run Builder Team agents
        run: node agents/builder-team.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # PER SLOT, not per run: with PARALLEL_BUILDERS=3 the Builder's real
          # daily draw is three times this. 250 x 3 = 750, which with the PM's 100
          # and one weekly agent (50) puts the worst day near 900 against the
          # account's 1000/day. Raising PARALLEL_BUILDERS without lowering this
          # multiplies the spend — the sum is what matters, not the number here.
          # Checked between tickets, so a ticket already in flight still finishes.
          MODEL_REQUEST_BUDGET: '250'
          # Requests are no longer the scarce thing — time is. A slot cannot spend
          # 250 requests inside the old 45 minutes, so the wall clock is raised to
          # match; without this the extra allowance simply cannot be reached.
          BUILD_RUN_BUDGET_MINUTES: '100'
          # This slot's ticket, assigned by the plan job. The Builder narrows to
          # exactly this ticket so it cannot wander onto a sibling slot's work.
          TICKET_NUMBER: ${{ matrix.ticket }}
          # AGENT_PAT (= the user) is the default token: Projects, issues, and
          # approving/merging the PR. BOT_TOKEN (= github-actions[bot]) opens the
          # PR as a DIFFERENT identity, so the PAT can legitimately approve it.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

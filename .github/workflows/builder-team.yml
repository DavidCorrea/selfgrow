name: builder-team

on:
  # Once a day, just after 00:00 UTC — when OpenRouter's free-model cap resets, so
  # the tick runs on a full allowance.
  #
  # One tick is enough because a tick now QUEUES four tickets and builds them one
  # after another (see max-parallel below), and a merged ticket measured 33-50 real
  # requests — so a single run's realistic draw is ~160 against a 1000/day cap.
  # Requests stopped being the binding constraint once the head model was fixed;
  # runner wall-clock is, which is why the queue lives inside one run rather than
  # across more ticks. A tick with nothing buildable is still free: the plan job is
  # pure gh API and build-ticket is skipped when count is 0.
  schedule:
    - cron: '5 0 * * *'

  # The Product Manager also dispatches this explicitly at the end of a run that
  # actually left buildable work (see kickBuilder in product-manager.mjs), so newly
  # groomed tickets start building immediately instead of waiting for the next tick.
  #
  # It used to trigger on `workflow_run` from product-manager, which fires when a
  # PM run COMPLETES — including runs whose job was skipped by a guard, and
  # including every run in a self-triggered burst. One grooming pass that created
  # 8 tickets produced 9 Builder runs. "The PM finished" and "there is work to
  # build" are different facts, and only the PM knows the second one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize every workflow that writes to main (builder-team + product-owner)
# so concurrent runs never race on branches or the push to main.
concurrency:
  group: agent-main-writer
  cancel-in-progress: false

jobs:
  # One reader decides who builds what. Nothing claims a ticket, so nothing can
  # race for one — see agents/plan-build.mjs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.assign.outputs.matrix }}
      count: ${{ steps.assign.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign tickets to slots
        id: assign
        run: node agents/plan-build.mjs
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          # How many tickets this run QUEUES, not how many run at once — the matrix
          # is capped at max-parallel 1 below, so these execute one after another.
          # Four is affordable because a measured ticket is ~40 requests: 4 x 150
          # (the per-slot ceiling) is 600 worst case, and realistically ~160.
          # Same-file collisions are no longer a reason to keep this small, since
          # sequential slots build on each other's merges rather than racing them.
          PARALLEL_BUILDERS: '4'

  build-ticket:
    needs: plan
    # Nothing buildable means no jobs at all, rather than a slot that spins up a
    # runner, installs Chromium and finds nothing to do.
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One slot failing must not cancel its siblings: their work is unrelated by
      # construction, and a cancelled builder can leave a branch and an open PR.
      fail-fast: false
      # SEQUENTIAL, not parallel — the matrix is a queue here, not a fan-out.
      #
      # Tickets are logically independent but not independent ON DISK, and running
      # them concurrently loses the race outright: #158 ("add a timeout guard to the
      # runtime") created docs/lang/run.js, and #149 ("implement the runtime core in
      # docs/lang/run.js") then died on unresolved merge conflicts after building
      # cleanly — its whole session discarded, and a strike against the ticket.
      #
      # At 1 each slot checks out AFTER the previous one merged, so it builds on
      # what shipped instead of racing it. Throughput barely suffers: a measured
      # ticket costs ~40 requests and ~2 minutes of model time, so the day's cap
      # affords far more sequential tickets than the runner has hours to burst.
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: build #${{ matrix.ticket }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required for fetch/merge/rebase against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (runtime verify)
        run: npx playwright install --with-deps chromium

      - name: Run Builder Team agents
        run: node agents/builder-team.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # REAL OpenRouter requests (one per agent turn), per slot, per run. This
          # number used to count agent SESSIONS, which understated the charge by
          # ~16x: a "250" slot authorised several thousand requests and the whole
          # 1000/day account fell over while the counter read 62.
          #
          # Sized from tickets that actually MERGED, which is the only measurement
          # worth trusting here. Two of them, both on ling-3.0-flash: #158 shipped
          # in 33 requests across 4 sessions, #149 built and reviewed in 50 across
          # 5. Earlier figures (150, then 400) were taken from runs on the old head
          # model, which spent ~85% of every ticket on sessions it then discarded —
          # measuring the waste, not the work.
          #
          # 150 is ~3x a real ticket, which absorbs a retry and a merge-conflict
          # pass without letting one pathological session eat the queue behind it.
          # The day: 4 queued tickets x 150 = 600 worst case, ~160 expected, plus
          # the Product Manager (100), against 1000.
          #
          # Enforced in three places: runAgent refuses to start a session once the
          # budget is spent, the build->review loop refuses to START a Builder it
          # cannot afford to review (BUILD_TAIL_RESERVE), and a retry is skipped
          # when the remainder is thin. The middle one is the important one — it is
          # what stops a run from spending everything on a build and then throwing
          # it away for want of a Reviewer.
          MODEL_REQUEST_BUDGET: '150'
          # Wall-clock backstop for a slot that stalls rather than spends. Only
          # gates BETWEEN tickets, so in slot mode (one ticket) it never fires —
          # the request budget above is the real limit and the job's timeout is
          # the last resort.
          BUILD_RUN_BUDGET_MINUTES: '60'
          # This slot's ticket, assigned by the plan job. The Builder narrows to
          # exactly this ticket so it cannot wander onto a sibling slot's work.
          TICKET_NUMBER: ${{ matrix.ticket }}
          # AGENT_PAT (= the user) is the default token: Projects, issues, and
          # approving/merging the PR. BOT_TOKEN (= github-actions[bot]) opens the
          # PR as a DIFFERENT identity, so the PAT can legitimately approve it.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

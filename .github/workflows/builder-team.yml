name: builder-team

on:
  # Twice a day, 00:00 and 12:00 UTC. 00:00 is deliberate: it's when OpenRouter's
  # free-model cap resets, so that tick runs on a full allowance.
  #
  # The frequency is set by the DAY'S BUDGET, not by how often we'd like to build.
  # A shipped ticket costs 100-150 real requests (Scout + Builder + Reviewer +
  # Validator, some retried), the account gets 1000/day, so the day affords 6-8
  # tickets TOTAL. 2 ticks x 2 slots x 160 = 640 worst case, leaving room for the
  # Product Manager (100) and a weekly agent (150). Adding ticks doesn't add
  # throughput once the budget is the binding constraint — it just means later
  # ticks fail on an empty allowance. A tick with nothing buildable is still free:
  # the plan job is pure gh API and build-ticket is skipped when count is 0.
  schedule:
    - cron: '0 0,12 * * *'

  # The Product Manager also dispatches this explicitly at the end of a run that
  # actually left buildable work (see kickBuilder in product-manager.mjs), so newly
  # groomed tickets start building immediately instead of waiting for the next tick.
  #
  # It used to trigger on `workflow_run` from product-manager, which fires when a
  # PM run COMPLETES — including runs whose job was skipped by a guard, and
  # including every run in a self-triggered burst. One grooming pass that created
  # 8 tickets produced 9 Builder runs. "The PM finished" and "there is work to
  # build" are different facts, and only the PM knows the second one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize every workflow that writes to main (builder-team + product-owner)
# so concurrent runs never race on branches or the push to main.
concurrency:
  group: agent-main-writer
  cancel-in-progress: false

jobs:
  # One reader decides who builds what. Nothing claims a ticket, so nothing can
  # race for one — see agents/plan-build.mjs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.assign.outputs.matrix }}
      count: ${{ steps.assign.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign tickets to slots
        id: assign
        run: node agents/plan-build.mjs
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          # Two slots. Every extra one is another branch that may touch the same
          # file, and the per-slot request budget multiplies by this number. Was 3,
          # dropped because free models also carry a 20 requests-per-MINUTE ceiling
          # that the credit purchase does not lift — three slots each running an
          # agentic loop burst past it, and a third slot cannot add throughput when
          # the day's request budget is already the binding constraint.
          PARALLEL_BUILDERS: '2'

  build-ticket:
    needs: plan
    # Nothing buildable means no jobs at all, rather than a slot that spins up a
    # runner, installs Chromium and finds nothing to do.
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One slot failing must not cancel its siblings: their work is unrelated by
      # construction, and a cancelled builder can leave a branch and an open PR.
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: build #${{ matrix.ticket }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required for fetch/merge/rebase against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (runtime verify)
        run: npx playwright install --with-deps chromium

      - name: Run Builder Team agents
        run: node agents/builder-team.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # REAL OpenRouter requests (one per agent turn), per slot, per run. This
          # number used to count agent SESSIONS, which understated the charge by
          # ~16x: a "250" slot authorised several thousand requests and the whole
          # 1000/day account fell over while the counter read 62.
          #
          # 160 is sized to finish ONE ticket — Scout + Builder + Reviewer +
          # Validator is 100-150 requests with a retry or two. Below ~100 a slot
          # cannot ship anything and merely burns the allowance getting partway.
          # The day's arithmetic: 2 ticks x 2 slots x 160 = 640, plus the Product
          # Manager (100) and one weekly agent (150), against 1000.
          #
          # Enforced in two places now, not zero: runAgent refuses to start a
          # session once the budget is spent, and the build->review loop stops
          # before an optional RETRY when the remainder is thin, so the run ends
          # with a reviewable PR instead of a stranded one.
          MODEL_REQUEST_BUDGET: '160'
          # Wall-clock backstop for a slot that stalls rather than spends. Only
          # gates BETWEEN tickets, so in slot mode (one ticket) it never fires —
          # the request budget above is the real limit and the job's timeout is
          # the last resort.
          BUILD_RUN_BUDGET_MINUTES: '60'
          # This slot's ticket, assigned by the plan job. The Builder narrows to
          # exactly this ticket so it cannot wander onto a sibling slot's work.
          TICKET_NUMBER: ${{ matrix.ticket }}
          # AGENT_PAT (= the user) is the default token: Projects, issues, and
          # approving/merging the PR. BOT_TOKEN (= github-actions[bot]) opens the
          # PR as a DIFFERENT identity, so the PAT can legitimately approve it.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

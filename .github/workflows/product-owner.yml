name: product-owner

on:
  schedule:
    # Monday, and deliberately the morning after the Product Manager's Sunday
    # report: the retro reads a week the PM has just finished grooming and
    # narrating, and the milestone it sets is what the PM grooms against for the
    # rest of the week.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # It opens and closes milestones, and the retro is written to the wiki.
  issues: write
  # It appends one entry per run to its own journal thread (a Discussion).
  discussions: write

# One retro per week, so one run at a time: two overlapping dispatches would each
# read the same week and write two retros and two journal entries. Its own group,
# not the writer lock — it never touches main.
concurrency:
  group: product-owner
  cancel-in-progress: false

jobs:
  refine-vision:
    runs-on: ubuntu-latest
    # Sized so the agent stops ITSELF first. MAX_SESSION_MINUTES (12) bounds a
    # session, this run makes one session, and setup is a few minutes on top — so the
    # runner's axe is the last resort, not the usual stop. The Product Owner was
    # killed at 20 minutes on 2026-07-27, losing the session and its whole spend.
    timeout-minutes: 30
    steps:
      # The PO edits the Vision in the wiki (a separate repo), not main — so no
      # main write and no shared writer lock are needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Nothing in this job pushes, so the token is not left in the checkout's
          # git config for the agent, or anything it runs, to pick up and use.
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Never as the node step's env — see the action.
      - uses: ./.github/actions/secrets
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # PAT carries `project` scope (for board cards) and covers issue creation.
          gh-token: ${{ secrets.AGENT_PAT }}

      - name: Run Product Owner agent
        run: node agents/product-owner.mjs
        env:
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

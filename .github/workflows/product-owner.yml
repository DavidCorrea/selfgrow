name: product-owner

on:
  schedule:
    # Weekly — the vision is a slow-moving north star, not a daily edit.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The PO edits the Vision in the wiki (a separate repo), not main — so no
      # main write and no shared writer lock are needed.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Run Product Owner agent
        run: node agents/product-owner.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # One vision judgement per week. This run's own allowance, in REAL
          # requests (one per agent turn), not sessions — see isRequestBudgetSpent.
          #
          # It is NOT what protects the account. The 1000/day cap is enforced by the
          # shared ledger in shared.mjs, which this run reads before its first call
          # and writes after every session, so it can see what the Builder (600) and
          # the PM (100) already spent today. This number only bounds this process.
          #
          # The agent makes one session, and a session is bounded by MAX_SESSION_TURNS
          # — this budget alone could not stop a long one, because it is only checked
          # before a session starts.
          MODEL_REQUEST_BUDGET: '150'
          # PAT carries `project` scope (for board cards) and covers issue creation.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

name: review-pr

# The Devs, applied to a pull request a person opened.
#
# Opening a PR is a contribution, not a request for permission: the team verifies
# it, reviews it, pushes fixes if it needs them, and merges it. The same gates as
# any agent-built change, in the same order.
#
# It never closes a PR and never merges one that has not passed verify.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

# One lock per PR, NOT the shared `agent-main-writer`. GitHub keeps only one
# PENDING run per concurrency group and cancels the older one when another
# queues — so sharing the Devs' lock meant a Devs dispatch arriving while a human
# PR's review waited silently dropped that review, and nothing ever re-ran it.
#
# Nor does anything here need that lock, even around the merge. This job never
# pushes to main: its fixes go to the PR's own branch, and it lands the PR with
# GitHub's merge API (`mergePR`), which GitHub applies to main atomically. A Devs
# merge landing first just moves main under it, and the required checks are not
# strict, so that does not invalidate this PR. Putting the lock on only the
# merging job would not help either — that job would sit in the same one-slot
# queue and be dropped the same way.
#
# Per PR, a newer push replacing an older push's queued review is what we want:
# the latest commit is the one worth reviewing.
concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Four guards, all necessary.
    #
    # FORKS are excluded. A pull_request run from a fork gets no secrets, so the
    # model call would fail anyway — but the important half is that this job checks
    # out the PR's head and runs an agent with write access over it, which must
    # never happen for a branch an outsider controls.
    #
    # DEPENDABOT is excluded because this job cannot run for it at all: a
    # Dependabot-triggered event reads the Dependabot secret store, not the Actions
    # one, so `secrets.AGENT_PAT` resolves EMPTY — the checkout used to die on
    # "Input required and not supplied: token" before a single line of review
    # happened, and every dependency bump failed this way. Mirroring the PAT
    # into Dependabot secrets would fix the symptom and hand a bot-opened PR an
    # agent with write access; `check` and `verify-product` are required on main
    # and already gate these, which is the review a version bump actually needs.
    #
    # The pipeline's own PRs are excluded twice over, by BRANCH and by author. The
    # branch check is the one that matters: agent PRs are opened by the PAT — they
    # have to be, or GitHub never starts their checks — so their author is a real
    # person and the author check alone would stop excluding them. Every one would
    # then be reviewed a second time here, by a second model, on a second budget,
    # after the Devs had already reviewed and merged it.
    #
    # The RESET's PR is excluded by branch for the same reason: it is opened by
    # the PAT too, and it only deletes the previous product. A Reviewer asked to
    # judge that would be judging a decision the operator already made by typing
    # the confirmation, and could push "fixes" onto the deletion.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'agent/') &&
      !startsWith(github.event.pull_request.head.ref, 'reset/') &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Up to two verify → review → fix cycles, each bounded by MAX_SESSION_MINUTES.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's own branch, with history — the Reviewer reads
          # `git diff main...HEAD` and a fix is pushed back here.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # A fix is pushed with GIT_TOKEN below, not a token left in the
          # checkout's git config where the agents' bash tool can read it.
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          # verifyBuild loads the real page in a real browser.
          playwright: 'true'

      # Never as the node step's env — see the action.
      - uses: ./.github/actions/secrets
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # The bot is BOTH tokens here, on purpose. shared.mjs approves and merges
          # with GH_TOKEN, and on these PRs the PAT is the author — GitHub does not
          # let an author approve their own PR. So GH_TOKEN is deliberately the bot,
          # which is the mirror image of the pipeline's own PRs, where the bot
          # opens and the PAT approves.
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          bot-token: ${{ secrets.GITHUB_TOKEN }}
          # Pushing a fix back to the contributor's branch is still the PAT's job,
          # since a GITHUB_TOKEN push would start none of the PR's checks.
          git-token: ${{ secrets.AGENT_PAT }}

      - name: Review the pull request
        run: node agents/review-pr.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

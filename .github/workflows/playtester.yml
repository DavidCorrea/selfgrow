name: playtester

on:
  schedule:
    # Every night, 90 minutes before the PM's 00:30 grooming, so its findings —
    # App Review's accessibility barriers among them — are on the board for the
    # very next run to groom. It used to run on Wednesdays only, and App Review
    # went to the PM directly; a layout regression now waits at most a day for a
    # player-facing finding instead of reaching the PM in the checker's words.
    # 23:00 is after the Devs' 14:00 mop-up and the day's merges, so it plays
    # what shipped today. The job's 30-minute cap ends it before the PM starts.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # It appends one entry per run to its own journal thread (a Discussion).
  discussions: write

# One playtester at a time: two concurrent sessions would form the same
# impression of the same app and file it twice.
concurrency:
  group: playtester
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    # Two minutes of watching, plus a reload, plus one model session bounded by
    # MAX_SESSION_MINUTES (12), plus setup and a Chromium install. Sized so the
    # agent stops itself first — the runner's axe is the last resort.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Nothing in this job pushes, so the token is not left in the checkout's
          # git config for the agent, or anything it runs, to pick up and use.
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          # It plays the real app in a real browser — this is the whole point.
          playwright: 'true'

      # Never as the node step's env — see the action.
      - uses: ./.github/actions/secrets
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # PAT covers issue creation; the findings are filed as ordinary issues.
          gh-token: ${{ secrets.AGENT_PAT }}

      - name: Run Playtester agent
        run: node agents/playtester.mjs
        env:
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'
          # Play the LIVE site, not a local copy of the repository. The difference
          # is "the code we merged works" versus "what a visitor gets works", and
          # only the second is what this agent is for.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

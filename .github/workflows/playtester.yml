name: playtester

on:
  schedule:
    # Wednesday — a day nothing else runs. The Product Owner is Monday,
    # pi-update Tuesday, the Tech Lead Thursday, so this never competes with
    # another weekly agent for the day's requests. It runs after the PM's 00:30
    # grooming so its findings sit on the board waiting for the NEXT morning's
    # run to triage, rather than arriving just too late for today's.
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One playtester at a time: two concurrent sessions would form the same
# impression of the same app and file it twice.
concurrency:
  group: playtester
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    # Two minutes of watching, plus a reload, plus one model session bounded by
    # MAX_SESSION_MINUTES (12), plus setup and a Chromium install. Sized so the
    # agent stops itself first — the runner's axe is the last resort.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          # It plays the real app in a real browser — this is the whole point.
          playwright: 'true'

      - name: Run Playtester agent
        run: node agents/playtester.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # One impression per week, and a cheap one: the session is a single
          # model call over a transcript that is already written by the time it
          # starts. There is no tool use and nothing to iterate on, so this is
          # generous rather than tight.
          #
          # The account's 1000/day cap is enforced elsewhere — the shared ledger
          # in shared.mjs, read before the first call and written after the
          # session, so this run sees what the day already spent.
          MODEL_REQUEST_BUDGET: '60'
          # PAT covers issue creation; the findings are filed as ordinary issues.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_PROJECT_OWNER: '@me'
          GH_PROJECT_NUMBER: '3'

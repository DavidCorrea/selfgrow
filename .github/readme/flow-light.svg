<text x="832" y="299" font-size="15" font-weight="650" fill="#1b1f24">Checks</text>
<text x="808" y="324" font-size="12" fill="#5b6472">syntax · lint · load</text>
<text x="808" y="341" font-size="12" fill="#5b6472">selftest · tools</text>

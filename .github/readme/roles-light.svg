<rect x="345.0" y="268" width="285.0" height="124" rx="16" fill="#39c5cf" fill-opacity="0.05"/>
<rect x="361.0" y="284" width="28" height="28" rx="8.0" fill="#39c5cf" fill-opacity="0.14"/><g transform="translate(367.0 290.0) scale(0.667)" fill="none" stroke="#39c5cf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="#39c5cf"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></g>
<text x="399.0" y="303" font-size="16" font-weight="650" fill="#1b1f24">Health</text>
<text x="363.0" y="338" font-size="13" fill="#5b6472">Watches the pipeline and speaks only</text>
<text x="363.0" y="357" font-size="13" fill="#5b6472">when something is broken.</text>

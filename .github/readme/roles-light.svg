<rect x="40.0" y="268" width="285.0" height="124" rx="16" fill="#db61a2" fill-opacity="0.05"/>
<rect x="56.0" y="284" width="28" height="28" rx="8.0" fill="#db61a2" fill-opacity="0.14"/><g transform="translate(62.0 290.0) scale(0.667)" fill="none" stroke="#db61a2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="#db61a2"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g>
<text x="94.0" y="303" font-size="16" font-weight="650" fill="#1b1f24">Playtester</text>
<text x="58.0" y="338" font-size="13" fill="#5b6472">Whether the product is any good to</text>
<text x="58.0" y="357" font-size="13" fill="#5b6472">be in front of.</text>

<rect x="345.0" y="74" width="285.0" height="124" rx="16" fill="#4493f8" fill-opacity="0.05"/>
<rect x="361.0" y="90" width="28" height="28" rx="8.0" fill="#4493f8" fill-opacity="0.14"/><g transform="translate(367.0 96.0) scale(0.667)" fill="none" stroke="#4493f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="#4493f8"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/></g>
<text x="399.0" y="109" font-size="16" font-weight="650" fill="#1b1f24">Product Manager</text>
<text x="363.0" y="144" font-size="13" fill="#5b6472">What gets built, in what order, and</text>
<text x="363.0" y="163" font-size="13" fill="#5b6472">what “done” means. Writes the Sunday</text>
<text x="363.0" y="182" font-size="13" fill="#5b6472">digest.</text>
<rect x="650.0" y="74" width="285.0" height="124" rx="16" fill="#ffffff" stroke="#e3e7ee" filter="url(#shadow)"/>
<rect x="650.0" y="74" width="285.0" height="124" rx="16" fill="#3fb950" fill-opacity="0.05"/>
<rect x="666.0" y="90" width="28" height="28" rx="8.0" fill="#3fb950" fill-opacity="0.14"/><g transform="translate(672.0 96.0) scale(0.667)" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="#3fb950"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></g>
<text x="704.0" y="109" font-size="16" font-weight="650" fill="#1b1f24">Devs</text>
<text x="668.0" y="144" font-size="13" fill="#5b6472">How to build a ticket, and whether a</text>
<text x="668.0" y="163" font-size="13" fill="#5b6472">build is good enough to merge.</text>
<rect x="955.0" y="74" width="285.0" height="124" rx="16" fill="#ffffff" stroke="#e3e7ee" filter="url(#shadow)"/>
<rect x="955.0" y="74" width="285.0" height="124" rx="16" fill="#2fb5a8" fill-opacity="0.05"/>

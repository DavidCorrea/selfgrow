<rect x="971.0" y="284" width="28" height="28" rx="8.0" fill="#8b949e" fill-opacity="0.14"/><g transform="translate(977.0 290.0) scale(0.667)" fill="none" stroke="#8b949e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="#8b949e"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4.5V9h-4.5"/></g>
<text x="1009.0" y="303" font-size="16" font-weight="650" fill="#1b1f24">pi-update</text>
<text x="973.0" y="338" font-size="13" fill="#5b6472">Keeps the agent runtime current, and</text>

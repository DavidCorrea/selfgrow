<text x="704.0" y="303" font-size="14" font-weight="650" fill="#1b1f24">review-pr / triage-fork-pr</text>
<text x="668.0" y="338" font-size="13" fill="#5b6472">Finishes a person's PR; reviews a</text>
<text x="668.0" y="357" font-size="13" fill="#5b6472">fork's as text.</text>

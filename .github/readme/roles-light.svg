<text x="1009.0" y="109" font-size="16" font-weight="650" fill="#1b1f24">Tech Lead</text>
<text x="973.0" y="144" font-size="13" fill="#5b6472">Whether the codebase still holds</text>
<text x="973.0" y="163" font-size="13" fill="#5b6472">together, and why parked tickets</text>
<text x="973.0" y="182" font-size="13" fill="#5b6472">failed.</text>
<text x="40" y="248" font-size="13" font-weight="700" letter-spacing="0.06em" fill="#1b1f24">JOBS</text>
<text x="96.0" y="248" font-size="12.5" fill="#5b6472">run on their own and own no judgement</text>

name: Agent secrets
description: Hands the job's secrets to the agent through a file, never through its environment.

# A process's starting environment stays readable through /proc/<pid>/environ by
# anything running as the same user — including the agents' bash tool — so the
# node step must never be STARTED with a secret in its `env:`. This step writes
# them to a mode-600 file instead; agents/secrets.mjs reads and deletes it on
# import, before any model runs. Only the file's PATH reaches later steps.
#
# The values arrive through this step's own env and are written with printf, so
# they are never interpolated into the script or echoed. An empty input writes
# no line.

inputs:
  openrouter-api-key:
    description: The model key (OPENROUTER_API_KEY).
    default: ''
  gh-token:
    description: The token gh runs as (GH_TOKEN).
    default: ''
  bot-token:
    description: The second identity that approves (BOT_TOKEN).
    default: ''
  git-token:
    description: >
      The token git pushes with (GIT_TOKEN). Only for jobs that push — their
      checkout must set persist-credentials false, or the token is on disk anyway.
    default: ''

runs:
  using: composite
  steps:
    - name: Write the secrets file
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GH_TOKEN: ${{ inputs.gh-token }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        GIT_TOKEN: ${{ inputs.git-token }}
      run: |
        umask 077
        file="$RUNNER_TEMP/agent-secrets"
        : > "$file"
        for name in OPENROUTER_API_KEY GH_TOKEN BOT_TOKEN GIT_TOKEN; do
          if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> "$file"; fi
        done
        echo "AGENT_SECRETS_FILE=$file" >> "$GITHUB_ENV"

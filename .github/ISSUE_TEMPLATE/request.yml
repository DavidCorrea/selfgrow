# The product is replaced on every reset but these forms are not, so nothing here
# names what the product currently is — examples included.
name: Ask for something
description: Something you want the product to do, or do differently.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This project is built by autonomous agents. Nobody is waiting to read this —
        the Product Manager grooms the backlog every morning and will pick it up then.

        The two fields below are the ones that decide whether this becomes a ticket
        the agents can build. A request they cannot picture concretely gets rewritten
        by the Product Manager into something they can, and its guess may not be
        yours — so the more specific you are here, the more likely you get what you
        actually wanted.

  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: The product as it is now, and how it should be different. Describe what you want to see or be able to do, not how to build it.
      placeholder: |
        Right now every piece of text uses the same font at the same weight, so the
        headings, numbers and hints all blend together. Headings should stand out,
        and the small hint text should be easy to read.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How would you know it worked?
      description: One or two things that would be true afterwards. This is what the agents build toward and what their self-checks assert, so it is the most useful thing on this form.
      placeholder: |
        - Headings use a different font from body text.
        - The smallest text on the page is still readable on a phone.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it matter? (optional)
      description: What it adds to the experience. Helps the Product Manager weigh it against everything else queued.
    validations:
      required: false

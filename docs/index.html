<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>selfgrow — a living garden</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1a1a2e; color: #d4d4dc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #garden-canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #garden-canvas-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Sidebar: garden state panel */
    #state-panel {
      width: 280px;
      background: #23233a;
      border-left: 1px solid #3a3a5a;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #state-panel h1 {
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #b8b8d0;
      border-bottom: 1px solid #3a3a5a;
      padding-bottom: 0.75rem;
    }

    #state-panel h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7a7a9a;
      margin-top: 0.25rem;
    }

    #state-panel p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #c0c0d8;
    }

    .state-section {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .state-value {
      font-size: 0.95rem;
      color: #e0e0f0;
    }

    .state-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9090b0;
    }

    /* Focus indicator for keyboard users */
    #state-panel:focus {
      outline: 2px solid #6a6aee;
      outline-offset: -2px;
    }

    /* Skip link — always reachable by pointer at top-left, collapsed to 1px when not focused */
    .skip-link {
      position: absolute;
      top: 0;
      left: 0;
      background: #5a5add;
      color: #fff;
      padding: 0 1rem;
      z-index: 1000;
      font-size: 0.9rem;
      border-radius: 0 0 4px 0;
      text-decoration: none;
      height: 1px;
      overflow: hidden;
      white-space: nowrap;
    }
    .skip-link:hover,
    .skip-link:focus,
    .skip-link:active {
      height: auto;
      padding: 0.5rem 1rem;
      overflow: visible;
      white-space: normal;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 640px) {
      #app {
        flex-direction: column;
      }
      #state-panel {
        width: 100%;
        height: 40%;
        border-left: none;
        border-top: 1px solid #3a3a5a;
      }
      #state-panel:focus {
        outline: 3px solid #6a6aee;
        outline-offset: -3px;
      }
      #garden-canvas-wrapper {
        height: 60%;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#state-panel">Skip to garden state</a>

  <div id="app" role="application" aria-label="selfgrow garden">
    <div id="garden-canvas-wrapper" role="presentation">
      <!-- Three.js canvas renders here -->
    </div>

    <aside id="state-panel" tabindex="0" role="region" aria-label="Garden state">
      <h1>selfgrow</h1>

      <div class="state-section">
        <span class="state-label">Season</span>
        <span class="state-value" id="season-display">Spring</span>
      </div>

      <div class="state-section">
        <span class="state-label">Time of day</span>
        <span class="state-value" id="time-display">Morning</span>
      </div>

      <div class="state-section">
        <span class="state-label">Weather</span>
        <span class="state-value" id="weather-display">Clear</span>
      </div>

      <div class="state-section">
        <span class="state-label">Plot</span>
        <p id="plot-description" tabindex="0">An empty plot of rich soil, ready for something to grow.</p>
      </div>

      <div class="state-section">
        <span class="state-label">Growing</span>
        <p id="growing-description">Nothing yet — the soil is waiting.</p>
      </div>

      <div class="state-section">
        <span class="state-label">Acknowledgment</span>
        <span class="state-value" id="garden-state-acknowledgment" aria-live="polite"></span>
      </div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.170.0",
      "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { initGarden, startSeasonalCycle, createFallenLeaves } from "./garden.js";
    import { createAmbientParticles } from "./particles.js";
    import { createGroundNoiseTexture } from "./groundNoise.js";
    import { createHorizon } from "./horizon.js";
    import { createScrub } from "./scrub.js";
    import { startDayNightCycle } from "./daynight.js";
    import { startWeatherCycle } from "./weather.js";
    import { loadGardenState, saveGardenState, fastForwardState, clearGardenState, SEASON_CYCLE_DURATION_MS } from "./persistence.js";
    import { createRain } from "./rain.js";
    import { createStars } from "./stars.js";
    import { createGroundRipple, computeDisplacement } from "./groundRipple.js";
    import { createCreature } from "./creature.js";
    import { createAmbientAudio } from "./ambientAudio.js";
    import { createFireflies } from "./fireflies.js";

    const wrapper = document.getElementById('garden-canvas-wrapper');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); /* soft sky blue */

    const camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 100);
    camera.position.set(4, 3, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    wrapper.prepend(renderer.domElement);

    /* Ambient light — soft fill */
    const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambientLight);

    /* Directional light — sun source, casts shadows */
    const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    sunLight.position.set(5, 10, 4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.1;
    sunLight.shadow.camera.far = 20;
    sunLight.shadow.camera.left = -5;
    sunLight.shadow.camera.right = 5;
    sunLight.shadow.camera.top = 5;
    sunLight.shadow.camera.bottom = -5;
    scene.add(sunLight);

    /* Secondary fill light from opposite side */
    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    /* Ground plane — rich soil with subtle procedural noise texture */
    const groundGeo = new THREE.CircleGeometry(4, 32);
    const groundNoiseTexture = createGroundNoiseTexture();
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x4a3728,
      map: groundNoiseTexture,
      roughness: 0.9,
      metalness: 0.0,
      side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    /* A subtle ring around the plot */
    const ringGeo = new THREE.RingGeometry(3.8, 4.2, 48);
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x5a4a38,
      roughness: 0.8,
      metalness: 0.0,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.3
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.0;
    scene.add(ring);

    /* Hemisphere light for sky/ground colour separation */
    const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x4a3728, 0.5);
    scene.add(hemiLight);

    /* Simple grid helper for depth perception (faint) */
    const gridHelper = new THREE.GridHelper(8, 12, 0x6a6a7a, 0x4a4a5a);
    gridHelper.position.y = 0.0;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.15;
    scene.add(gridHelper);

    /* Click handler so pointer clicks (not just keyboard tab) work
       - Prevent default hash jump
       - Focus the state panel so screen readers announce it
       - Scroll the panel into view on mobile where it sits below the canvas */
    document.querySelector('.skip-link').addEventListener('click', function(e) {
      e.preventDefault();
      const panel = document.getElementById('state-panel');
      if (panel) {
        panel.focus();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        panel.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'nearest' });
      }
    });

    /* --- OrbitControls with smooth damping --- */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minPolarAngle = 0.1;          // never fully top-down
    controls.maxPolarAngle = Math.PI / 2.3; // never below the ground plane
    controls.minDistance = 1.5;            // prevent zooming too close — keep plants in context
    controls.maxDistance = 12;             // prevent zooming too far — horizon and scrub remain visible
    controls.target.set(0, 0.4, 0);        // aim at the seedling's height
    controls.rotateSpeed = 0.5;            // unhurried, botanical pace
    controls.update();

    /* --- Camera stillness tracking for user-acknowledgment (issue #544) --- */
    const ACKNOWLEDGMENT_SENTENCES = [
      'You pause to look, and the garden feels still around you.',
      'Your presence settles into the quiet of the garden.',
      'The garden acknowledges your patient gaze.',
      'Stillness passes between you and the garden.',
      'You breathe, and the garden seems to breathe with you.'
    ];

    const ACKNOWLEDGMENT_COOLDOWN_MS = 60_000;
    const STILLNESS_THRESHOLD_MS = 15_000;

    let lastInteractionTime = performance.now();
    let lastAcknowledgmentTime = 0;

    function getReducedMotionPref() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    controls.addEventListener('change', function onControlsChange() {
      creature.notifyCameraMoved();
      if (getReducedMotionPref()) return;

      const now = performance.now();
      const idleDuration = now - lastInteractionTime;
      const timeSinceLastAck = now - lastAcknowledgmentTime;

      if (idleDuration >= STILLNESS_THRESHOLD_MS && timeSinceLastAck >= ACKNOWLEDGMENT_COOLDOWN_MS) {
        lastAcknowledgmentTime = now;
        const sentence = ACKNOWLEDGMENT_SENTENCES[Math.floor(Math.random() * ACKNOWLEDGMENT_SENTENCES.length)];
        const ackEl = document.getElementById('garden-state-acknowledgment');
        if (ackEl) {
          ackEl.textContent = sentence;
        }
      }

      lastInteractionTime = now;
    });

    /* --- Distant horizon tree-line silhouette --- */
    const horizon = createHorizon(scene);

    /* --- Mid-ground scrub/bush silhouettes --- */
    const scrub = createScrub(scene);

    /* Resize handler */
    function onResize() {
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    /* --- Ambient floating particles (dust motes / pollen) --- */
    const particles = createAmbientParticles(scene);

    /* --- Rain particle system (visible during Light Drizzle) --- */
    const rain = createRain(scene);
    rain.update(0, 0.016); // initialise to safe state

    /* --- Star field (visible only during Night phase) --- */
    const stars = createStars(scene);
    stars.update(0, 0.016); // initialise to safe state

    /* --- Subtle ground ripple suggesting moving air --- */
    const groundRipple = createGroundRipple(ground);

    /* --- Drifting creature at the scene periphery --- */
    const creature = createCreature(scene);

    /* --- Firefly glow dots near plants during Night phase --- */
    const fireflies = createFireflies(scene);

    /* Animation loop */
    let animTime = 0;
    let lastFrameTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastFrameTime) / 1000, 0.05); // cap dt to avoid spiral
      lastFrameTime = now;

      animTime += dt;
      controls.update();
      particles.update(animTime);

      /* Update rain: pass absolute time and delta time */
      rain.update(animTime, dt);

      /* Update ground ripple animation */
      groundRipple.update(animTime);

      /* Update fallen leaves to respond to ground ripple */
      const fallenLeaves = window.__gardenState && window.__gardenState.fallenLeaves;
      if (fallenLeaves && typeof fallenLeaves.update === 'function') {
        fallenLeaves.update(animTime, computeDisplacement);
      }

      /* Update creature position */
      creature.update(animTime);

      /* Update star field */
      stars.update(animTime, dt);

      /* Update firefly glow dots */
      fireflies.update(animTime, dt);

      /* Update distant horizon silhouette to blend with current sky colour */
      if (scene.background instanceof THREE.Color) {
        horizon.update(scene.background);
        scrub.update(scene.background);
      }

      renderer.render(scene, camera);
    }

    animate();

    /* Update plot description to reflect the drifting haze */
    const plotDesc = document.getElementById('plot-description');
    if (plotDesc && plotDesc.textContent === 'An empty plot of rich soil, ready for something to grow.') {
      plotDesc.textContent = 'An empty plot of rich soil, ready for something to grow. A faint haze drifts in the air.';
    }

    /* Time-of-day-aware description contexts (issue #493).
     * Each phase provides a sentence that weaves atmospheric context into
     * the plot and growing descriptions without replacing the base text,
     * composing with weather and butterfly layers.
     */
    const TIME_OF_DAY_CONTEXTS = {
      'Morning': 'Soft awakening light spreads across the garden, the air gentle and warm.',
      'Midday': 'Bright clear light fills the garden, the sun warm and steady overhead.',
      'Evening': 'Golden tones settling across the garden as the light mellows toward dusk.',
      'Night': 'Darkness and deep quiet hold the garden, lit by stars and firefly glow.'
    };

    const TIME_OF_DAY_CONTEXT_STRINGS = Object.values(TIME_OF_DAY_CONTEXTS);

    function timeContextFor(phase) {
      return TIME_OF_DAY_CONTEXTS[phase] || '';
    }

    function chooseTimeOfDayContext() {
      const phase = (document.getElementById('time-display')?.textContent || '').trim();
      return timeContextFor(phase);
    }

    /* Weather-aware description contexts (issue #492).
     * Each phase provides a sentence that weaves atmospheric context into
     * the plot and growing descriptions without replacing the base text.
     */
    const WEATHER_CONTEXTS = {
      'Clear': 'Clear skies and warm air hold the garden in bright, untroubled light.',
      'Overcast': 'Soft grey light settles over the garden, its colours muted and calm.',
      'Light Drizzle': 'Gentle rain falls over the garden, leaving the air fresh and clean.'
    };

    const WEATHER_CONTEXT_STRINGS = Object.values(WEATHER_CONTEXTS);

    function weatherContextFor(phase) {
      return WEATHER_CONTEXTS[phase] || '';
    }

    function chooseWeatherContext() {
      const phase = (document.getElementById('weather-display')?.textContent || '').trim();
      return weatherContextFor(phase);
    }

    /* Season-aware description contexts (issue #494).
     * Each season provides a sentence that weaves seasonal character into
     * the plot and growing descriptions without replacing the base text,
     * composing with time, weather and butterfly layers.
     */
    const SEASON_CONTEXTS = {
      'Spring': 'New growth pushes up through the soil, fresh green stems emerging in the soft air.',
      'Summer': 'The garden stands lush and full, leaves rich with deep summer warmth.',
      'Autumn': 'Golden and brown tones spread through the garden as leaves fall and quiet decline settles in.',
      'Winter': 'Bare stems stand dormant in the stillness, the garden hushed beneath a light frost.'
    };

    const SEASON_CONTEXT_STRINGS = Object.values(SEASON_CONTEXTS);

    function seasonContextFor(phase) {
      return SEASON_CONTEXTS[phase] || '';
    }

    function chooseSeasonContext() {
      const phase = (document.getElementById('season-display')?.textContent || '').trim();
      return seasonContextFor(phase);
    }

    /* Shared suffix-stripping helper: removes any suffix found in the list
     * from the end of the given text. Used by both weather and butterfly
     * updaters so they compose cleanly without cross-talk.
     */
    function stripSuffixes(text, suffixes) {
      for (const suffix of suffixes) {
        if (text.endsWith(suffix)) {
          return text.slice(0, -suffix.length);
        }
      }
      return text;
    }

    /* Strips all occurrences of any context string from anywhere in the text.
     * Unlike stripSuffixes, this targets contexts that may be in the middle
     * of the text (e.g. time context before weather context). Used by both
     * time-of-day and weather updaters so stale contexts are always removed
     * regardless of composition position.
     */
        function stripAllContexts(text, contextStrings) {
      let result = text;
      for (const ctx of contextStrings) {
        // Escape special regex characters in the context string
        const escaped = ctx.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        // Remove the context and any surrounding whitespace
        result = result.replace(new RegExp('\\s*' + escaped + '\\s*', 'g'), '');
      }
      // Clean up duplicate whitespace and trim
      return result.replace(/\s+/g, ' ').trim();
    }
    /* Time-of-day-aware description updater (issue #493).
     * Reads the current time-of-day phase from #time-display and weaves a
     * time-appropriate context sentence into the plot and growing descriptions,
     * composing with existing weather and butterfly layers.
     *
     * Composition order: base + timeContext + weatherContext (+ butterflySuffix).
     */
    let lastTimeDescPlot = '';
    let lastTimeDescGrowing = '';
    function updateTimeOfDayDescription() {
      const timeCtx = chooseTimeOfDayContext();
      const weatherCtx = chooseWeatherContext();
      if (!timeCtx) return;

      const allContextStrings = TIME_OF_DAY_CONTEXT_STRINGS.concat(WEATHER_CONTEXT_STRINGS);

      /* Plot description — strip all time and weather contexts, compose fresh */
      const plotEl = document.getElementById('plot-description');
      if (plotEl) {
        const base = stripAllContexts(plotEl.textContent, allContextStrings);
        const plotComposed = base + ' ' + timeCtx + (weatherCtx ? ' ' + weatherCtx : '');
        if (plotComposed !== lastTimeDescPlot) {
          lastTimeDescPlot = plotComposed;
          plotEl.textContent = plotComposed;
        }
      }

      /* Growing description — preserve butterfly suffix (outermost), then
       * strip all time and weather contexts, compose as
       * base + timeCtx + weatherCtx + butterflySuffix. */
      const growingEl = document.getElementById('growing-description');
      if (growingEl) {
        /* Find and save any existing butterfly suffix (outermost layer) */
        let butterflySuffix = '';
        for (const suffix of BUTTERFLY_SUFFIXES) {
          if (growingEl.textContent.endsWith(suffix)) {
            butterflySuffix = suffix;
            break;
          }
        }
        /* Strip butterfly suffix to expose weather + time layers */
        const withoutButterfly = butterflySuffix
          ? growingEl.textContent.slice(0, -butterflySuffix.length)
          : growingEl.textContent;
        /* Strip all time and weather contexts to reach base text from garden.js */
        const growingBase = stripAllContexts(withoutButterfly, allContextStrings);
        const growingComposed = growingBase + ' ' + timeCtx + (weatherCtx ? ' ' + weatherCtx : '') + butterflySuffix;
        if (growingComposed !== lastTimeDescGrowing) {
          lastTimeDescGrowing = growingComposed;
          growingEl.textContent = growingComposed;
        }
      }
    }

    /* Update #plot-description and #growing-description with weather-appropriate
     * atmospheric context. Strips any previous weather and time context from the
     * end of each description, preserving the base plant/flower text set by
     * garden.js and (for growing) any butterfly suffix.
     *
     * Composition order: base + timeContext + weatherContext + butterflySuffix.
     * This function strips both time and weather context strings so it composes
     * cleanly with updateTimeOfDayDescription's layer.
     */
    let lastWeatherDescPlot = '';
    let lastWeatherDescGrowing = '';
    function updateWeatherDescription() {
      const weatherCtx = chooseWeatherContext();
      const timeCtx = chooseTimeOfDayContext();
      if (!weatherCtx) return;

      const allContextStrings = TIME_OF_DAY_CONTEXT_STRINGS.concat(WEATHER_CONTEXT_STRINGS);

      /* Plot description — strip all time and weather contexts, compose fresh */
      const plotEl = document.getElementById('plot-description');
      if (plotEl) {
        const plotBase = stripAllContexts(plotEl.textContent, allContextStrings);
        const plotComposed = plotBase + ' ' + timeCtx + ' ' + weatherCtx;
        if (plotComposed !== lastWeatherDescPlot) {
          lastWeatherDescPlot = plotComposed;
          plotEl.textContent = plotComposed;
        }
      }

      /* Growing description — preserve butterfly suffix (outermost), then
       * strip all time and weather contexts, compose as base + timeCtx + weatherCtx + butterflySuffix. */
      const growingEl = document.getElementById('growing-description');
      if (growingEl) {
        /* Find and save any existing butterfly suffix (it is the outermost layer) */
        let butterflySuffix = '';
        for (const suffix of BUTTERFLY_SUFFIXES) {
          if (growingEl.textContent.endsWith(suffix)) {
            butterflySuffix = suffix;
            break;
          }
        }
        /* Strip butterfly suffix to expose the weather-context layer */
        const withoutButterfly = butterflySuffix
          ? growingEl.textContent.slice(0, -butterflySuffix.length)
          : growingEl.textContent;
        /* Strip all time and weather contexts to reach the base text from garden.js */
        const growingBase = stripAllContexts(withoutButterfly, allContextStrings);
        const growingComposed = growingBase + ' ' + timeCtx + ' ' + weatherCtx + butterflySuffix;
        if (growingComposed !== lastWeatherDescGrowing) {
          lastWeatherDescGrowing = growingComposed;
          growingEl.textContent = growingComposed;
        }
      }
    }

    /* Season-aware description updater (issue #494).
     * Reads the current season from #season-display and weaves a
     * season-appropriate context sentence into the plot and growing
     * descriptions, composing with existing time, weather and butterfly
     * layers.
     *
     * Composition order: base + seasonCtx + timeCtx + weatherCtx (+ butterflySuffix).
     * This is the sole owner of the season layer — time and weather updaters
     * do NOT include season context strings in their strip lists, so the
     * season context survives their rewrites unchanged.
     */
    let lastSeasonDescPlot = '';
    let lastSeasonDescGrowing = '';
    function updateSeasonDescription() {
      const seasonCtx = chooseSeasonContext();
      const timeCtx = chooseTimeOfDayContext();
      const weatherCtx = chooseWeatherContext();
      if (!seasonCtx) return;

      const allContextStrings = SEASON_CONTEXT_STRINGS.concat(TIME_OF_DAY_CONTEXT_STRINGS).concat(WEATHER_CONTEXT_STRINGS);

      /* Plot description — strip all season, time and weather contexts, compose fresh */
      const plotEl = document.getElementById('plot-description');
      if (plotEl) {
        const base = stripAllContexts(plotEl.textContent, allContextStrings);
        const plotComposed = base + ' ' + seasonCtx + ' ' + timeCtx + (weatherCtx ? ' ' + weatherCtx : '');
        if (plotComposed !== lastSeasonDescPlot) {
          lastSeasonDescPlot = plotComposed;
          plotEl.textContent = plotComposed;
        }
      }

      /* Growing description — preserve butterfly suffix (outermost), then
       * strip all season, time and weather contexts, compose as
       * base + seasonCtx + timeCtx + weatherCtx + butterflySuffix. */
      const growingEl = document.getElementById('growing-description');
      if (growingEl) {
        /* Find and save any existing butterfly suffix (outermost layer) */
        let butterflySuffix = '';
        for (const suffix of BUTTERFLY_SUFFIXES) {
          if (growingEl.textContent.endsWith(suffix)) {
            butterflySuffix = suffix;
            break;
          }
        }
        /* Strip butterfly suffix to expose weather + time + season layers */
        const withoutButterfly = butterflySuffix
          ? growingEl.textContent.slice(0, -butterflySuffix.length)
          : growingEl.textContent;
        /* Strip all season, time and weather contexts to reach base text from garden.js */
        const growingBase = stripAllContexts(withoutButterfly, allContextStrings);
        const growingComposed = growingBase + ' ' + seasonCtx + ' ' + timeCtx + (weatherCtx ? ' ' + weatherCtx : '') + butterflySuffix;
        if (growingComposed !== lastSeasonDescGrowing) {
          lastSeasonDescGrowing = growingComposed;
          growingEl.textContent = growingComposed;
        }
      }
    }

    /* Butterfly description suffixes.
     * Called on an interval and exposed on __gardenState for testing.
     * Strips any known butterfly suffix from the base growing-description
     * text (set by garden.js) and appends the correct suffix based on
     * current weather and time-of-day. Weather context woven in by
     * updateWeatherDescription is preserved (it sits between base and suffix).
     */
    const BUTTERFLY_SUFFIXES = [
      ' A small butterfly drifts at the edge of the garden.',
      ' The butterfly has taken shelter from the drizzle.',
      ' The butterfly rests quietly through the night.'
    ];

    function chooseButterflySuffix() {
      const weather = (document.getElementById('weather-display')?.textContent || '').trim();
      const time = (document.getElementById('time-display')?.textContent || '').trim();

      if (weather === 'Light Drizzle') {
        return ' The butterfly has taken shelter from the drizzle.';
      }
      if (time === 'Night') {
        return ' The butterfly rests quietly through the night.';
      }
      return ' A small butterfly drifts at the edge of the garden.';
    }

    let lastButterflyText = '';
    function updateButterflyDescription() {
      const el = document.getElementById('growing-description');
      if (!el) return;

      const suffix = chooseButterflySuffix();
      /* Strip any butterfly suffix, leaving weather context intact */
      const base = stripSuffixes(el.textContent, BUTTERFLY_SUFFIXES);
      const composed = base + suffix;

      if (composed !== lastButterflyText) {
        lastButterflyText = composed;
        el.textContent = composed;
      }
    }

    /* Expose horizon and scrub on garden state */
    horizon.group.name = 'horizon';
    scrub.group.name = 'scrub';

    /* Expose state getters for selftest and future updates */
    window.__gardenState = {
      scene,
      camera,
      renderer,
      controls,
      groundMat,
      groundNoiseTexture,
      particles: particles.state,
      particlesUpdate: particles.update,
      rain: rain.state,
      rainUpdate: rain.update,
      stars: stars.state,
      starsUpdate: stars.update,
      getSeason: () => document.getElementById('season-display')?.textContent || 'Spring',
      getTimeOfDay: () => document.getElementById('time-display')?.textContent || 'Morning',
      getWeather: () => document.getElementById('weather-display')?.textContent || 'Clear',
      getPlotDescription: () => document.getElementById('plot-description')?.textContent || '',
      getGrowingDescription: () => document.getElementById('growing-description')?.textContent || '',
      horizon,
      scrub,
      groundRipple: groundRipple.state,
      creature: creature.state,
      creatureUpdate: creature.update,
      creatureNotifyCameraMoved: creature.notifyCameraMoved,
      fireflies: fireflies.state,
      firefliesUpdate: fireflies.update,
      /* Base seasonal ground colour (before winter legacy or rain darkening).
       * Set by startSeasonalCycle each tick, read by weather.js for rain darkening (issue #528). */
      baseGroundColor: new THREE.Color(0x4a3728),
      /* Winter legacy effect (issue #471): set by startSeasonalCycle each tick */
      winterLegacyBlend: 0,
      updateButterflyDescription,
      updateAudioWeather,
      updateWeatherDescription,
      weatherContexts: WEATHER_CONTEXTS,
      weatherContextFor,
      timeContexts: TIME_OF_DAY_CONTEXTS,
      timeContextFor,
      updateTimeOfDayDescription,
      seasonContexts: SEASON_CONTEXTS,
      seasonContextFor,
      updateSeasonDescription,
      /* Camera stillness acknowledgment (issue #544) */
      _acknowledgmentSentences: ACKNOWLEDGMENT_SENTENCES,
      _acknowledgmentCooldown: ACKNOWLEDGMENT_COOLDOWN_MS,
      _stillnessThreshold: STILLNESS_THRESHOLD_MS
    };

    /* --- Persistence: restore previous state if available --- */
    const savedState = loadGardenState();
    let initial = null;

    if (savedState) {
      // Fast-forward the saved state by elapsed real time
      initial = fastForwardState(savedState);
    }

    /* Initialise garden with optional restored progress */
    initGarden(scene, initial);

    /* Returning visitor greeting — compute elapsed real time from saved timestamp
     * and acknowledge specific changes since last visit (issue #560).
     * Runs AFTER initGarden so the greeting is the last description update before
     * the interval updaters start, ensuring it is shown immediately on page load
     * before context layers.
     * First-time visitors (no savedState) are unaffected and keep the default text.
     * The greeting text is preserved through description updaters because it does
     * not match any context string — updaters treat it as the base text and compose
     * context around it.
     *
     * Detects three types of change by comparing savedState to currentState:
     *   1. plant2 appeared (saved had no plant2, current does)
     *   2. season changed (derived from seasonProgress)
     *   3. flower bloomed or faded (derived from flower phase)
     * Falls back to generic time-based greeting when nothing specific changed.
     */
    function computeReturningVisitorGreeting(elapsedMs, savedState, currentState) {
      // First-time visitor — no saved state, no greeting
      if (!savedState) return '';

      const SEASON_NAMES = ['Spring', 'Summer', 'Autumn', 'Winter'];

      const parts = [];

      // 1. Detect plant2 appearance
      const savedHadPlant2 = savedState.plant2Maturity !== undefined && savedState.plant2Maturity > 0;
      const currentHasPlant2 = currentState && currentState.plant2Maturity !== undefined && currentState.plant2Maturity > 0;

      if (!savedHadPlant2 && currentHasPlant2) {
        parts.push('a second plant has emerged beside the first');
      }

      // 2. Detect season change
      const savedSeasonIndex = Math.floor((savedState.seasonProgress || 0) * 4) % 4;
      const currentSeasonIndex = currentState ? Math.floor((currentState.seasonProgress || 0) * 4) % 4 : -1;

      if (currentSeasonIndex !== savedSeasonIndex && currentSeasonIndex >= 0) {
        parts.push('the garden has entered ' + SEASON_NAMES[currentSeasonIndex]);
      }

      // 3. Detect flower bloom or fade (plant1)
      const savedP1Phase = savedState.plant1FlowerPhase;
      const currentP1Phase = currentState ? currentState.plant1FlowerPhase : undefined;

      if (savedP1Phase && currentP1Phase && savedP1Phase !== currentP1Phase) {
        if (currentP1Phase === 'bloom' || currentP1Phase === 'opening') {
          parts.push('the flower has bloomed');
        } else if (currentP1Phase === 'fading' || currentP1Phase === 'dormant') {
          if (savedP1Phase === 'bloom' || savedP1Phase === 'opening' || savedP1Phase === 'budding') {
            parts.push('the flower has faded');
          }
        }
      }

      // Also check plant2 flower if it exists
      const savedP2Phase = savedState.plant2FlowerPhase;
      const currentP2Phase = currentState ? currentState.plant2FlowerPhase : undefined;

      if (savedP2Phase && currentP2Phase && savedP2Phase !== currentP2Phase) {
        if (currentP2Phase === 'bloom' || currentP2Phase === 'opening') {
          parts.push('the companion flower has bloomed');
        } else if (currentP2Phase === 'fading' || currentP2Phase === 'dormant') {
          if (savedP2Phase === 'bloom' || savedP2Phase === 'opening' || savedP2Phase === 'budding') {
            parts.push('the companion flower has faded');
          }
        }
      }

      // Build the greeting
      if (parts.length === 0) {
        // Fall back to generic time-based greeting
        if (elapsedMs < SEASON_CYCLE_DURATION_MS) {
          return 'You return to the garden. It has quietly continued growing while you were away.';
        } else {
          const seasonsPassed = Math.floor(elapsedMs / SEASON_CYCLE_DURATION_MS);
          const seasonWord = seasonsPassed === 1 ? 'season' : 'seasons';
          return 'You return after ' + seasonsPassed + ' ' + seasonWord + '. The garden continued through the cycles while you were away.';
        }
      }

      let greeting = 'You return to find ';
      if (parts.length === 1) {
        greeting += parts[0] + '.';
      } else if (parts.length === 2) {
        greeting += parts[0] + ' and ' + parts[1] + '.';
      } else {
        greeting += parts.slice(0, -1).join(', ') + ', and ' + parts[parts.length - 1] + '.';
      }

      return greeting;
    }

    if (savedState) {
      const elapsed = Date.now() - savedState.timestamp;
      const greeting = computeReturningVisitorGreeting(elapsed, savedState, initial);
      const plotDesc = document.getElementById('plot-description');
      if (plotDesc) {
        plotDesc.textContent = greeting;
      }
      // Store for self-test verification
      window.__gardenState.returningVisitorGreeting = greeting;
      window.__gardenState._returningVisitorElapsedMs = elapsed;
      window.__gardenState._returningVisitorSavedState = savedState;
      window.__gardenState._returningVisitorCurrentState = initial;
    }

    // Expose the helper for self-test
    window.__gardenState.computeReturningVisitorGreeting = computeReturningVisitorGreeting;

    /* Create fallen leaves that respond to the seasonal cycle */
    createFallenLeaves(scene);

    startSeasonalCycle(initial ? initial.seasonProgress : undefined);
    startDayNightCycle(sunLight, scene, ambientLight, hemiLight, fillLight, initial ? initial.dayNightProgress : undefined);
    startWeatherCycle(sunLight, scene, ambientLight, hemiLight, fillLight, particles, initial ? initial.weatherProgress : undefined);

    /* --- Ambient audio: wind and rain soundscape --- */
    const ambientAudio = createAmbientAudio();

    /* Expose audio state for selftest */
    window.__gardenState.ambientAudio = ambientAudio;

    /* Resume AudioContext on first user interaction (click/tap) */
    const resumeAudio = () => {
      ambientAudio.resumeOnInteraction();
      document.removeEventListener('click', resumeAudio);
      document.removeEventListener('touchstart', resumeAudio);
    };
    document.addEventListener('click', resumeAudio);
    document.addEventListener('touchstart', resumeAudio);

    /* Poll the weather phase, time-of-day and season every ~1s and update audio character.
     * Triggers when ANY of weather, time or season changes.
     * Season composes on top of time-of-day and weather (mirroring description composition).
     */
    let lastAudioWeather = '';
    let lastAudioTime = '';
    let lastAudioSeason = '';
    function updateAudioWeather() {
      const weatherPhase = document.getElementById('weather-display')?.textContent?.trim() || '';
      const timeOfDay = document.getElementById('time-display')?.textContent?.trim() || '';
      const season = document.getElementById('season-display')?.textContent?.trim() || '';
      if ((weatherPhase !== lastAudioWeather || timeOfDay !== lastAudioTime || season !== lastAudioSeason) && weatherPhase) {
        lastAudioWeather = weatherPhase;
        lastAudioTime = timeOfDay;
        lastAudioSeason = season;
        ambientAudio.update(weatherPhase, timeOfDay, season);
      }
    }

    /* Check weather on a regular interval (smooth transitions are handled by setTargetAtTime) */
    setInterval(updateAudioWeather, 1000);

    /* Poll the weather and time displays every ~1s and update butterfly description */
    setInterval(updateButterflyDescription, 1000);

    /* Poll the weather display every ~1s and update weather-aware descriptions */
    setInterval(updateWeatherDescription, 1000);

    /* Poll the time display every ~1s and update time-of-day-aware descriptions */
    setInterval(updateTimeOfDayDescription, 1000);

    /* Poll the season display every ~1s and update season-aware descriptions */
    setInterval(updateSeasonDescription, 1000);

    /* --- Periodic save: every 2 seconds capture current state --- */
    setInterval(saveGardenState, 2000);

    /* Also save when the page is about to unload */
    window.addEventListener('beforeunload', saveGardenState);
  </script>
</body>
</html>

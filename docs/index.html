<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>selfgrow — Self-Growing Functional Language</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-elevated: #161b22;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --editor-bg: #0d1117;
      --output-bg: #0d1117;
      --error: #f85149;
      --success: #3fb950;
      --focus: #58a6ff;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --spacing: 1rem;
      --radius: 6px;
      --transition: 150ms ease;
      --header-height: 4rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    a:focus-visible,
    button:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Header */
    header {
      padding: var(--spacing) calc(var(--spacing) * 2);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing);
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent);
    }

    /* Main layout */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing) calc(var(--spacing) * 2);
      min-height: calc(100vh - 200px);
    }

    /* Playground */
    .playground {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing);
      margin-bottom: calc(var(--spacing) * 3);
    }

    @media (max-width: 900px) {
      .playground {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
    }

    .pane-header {
      padding: calc(var(--spacing) * 0.75) var(--spacing);
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg-muted);
      background: rgba(255,255,255,0.02);
    }

    .pane-content {
      flex: 1;
      padding: var(--spacing);
      overflow: hidden;
    }

    /* Editor */
    .editor-wrapper {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: auto;
      background: var(--editor-bg);
    }

    #editor {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--fg);
      border: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      tab-size: 2;
      padding: var(--spacing);
      position: relative;
      z-index: 1;
      overflow: auto;
      scrollbar-gutter: stable;
      white-space: pre;
    }

    #editor::placeholder {
      color: var(--fg-muted);
      opacity: 0.6;
    }

    #editor:focus {
      outline: none;
    }

    #highlightOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      tab-size: 2;
      padding: var(--spacing);
      overflow: auto;
      scrollbar-gutter: stable;
      white-space: pre;
      color: var(--fg);
    }

    /* Syntax token colours — dark theme */
    .tok-keyword { color: #ff7b72; }
    .tok-string { color: #a5d6ff; }
    .tok-number { color: #79c0ff; }
    .tok-boolean { color: #ff7b72; }
    .tok-identifier { color: #e6edf3; }
    .tok-operator { color: #d2a8ff; }
    .tok-punctuation { color: #8b949e; }

    /* Error token highlight — use error colour for selection */
    #editor::selection { background: var(--error); color: var(--fg); }
    #highlightOverlay::selection { background: var(--error); color: var(--fg); }

    /* Output */
    #output {
      background: var(--output-bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      height: 100%;
      width: 100%;
      overflow: auto;
    }

    #output:empty::before {
      content: "Output will appear here…";
      color: var(--fg-muted);
      opacity: 0.5;
    }

    .output-error {
      color: var(--error);
    }

    .output-value {
      color: var(--success);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: calc(var(--spacing) * 0.5);
      padding: calc(var(--spacing) * 0.75) var(--spacing);
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    button {
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }

    button:hover {
      background: var(--bg-elevated);
      border-color: var(--accent);
    }

    button:active {
      background: var(--border);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    select {
      font-family: var(--font-ui);
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    select:hover {
      border-color: var(--accent);
    }

    select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Footer */
    footer {
      padding: calc(var(--spacing) * 2);
      text-align: center;
      color: var(--fg-muted);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      margin-top: calc(var(--spacing) * 3);
    }

    /* Anchor scroll offset to account for sticky header */
    #playground {
      scroll-margin-top: calc(var(--header-height) + var(--spacing));
    }

    /* Visually hidden for screen readers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: var(--bg);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      z-index: 100;
      transition: top var(--transition);
    }

    .skip-link:focus {
      top: var(--spacing);
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* High contrast mode support */
    @media (prefers-contrast: high) {
      :root {
        --border: #8b949e;
        --fg-muted: #c9d1d9;
      }
    }

    @media (max-width: 390px) {
      :root {
        --spacing: 0.5rem;
        font-size: 14px;
      }
      .pane-header {
        padding: calc(var(--spacing) * 0.5) var(--spacing);
        font-size: 0.75rem;
      }
      .controls {
        padding: calc(var(--spacing) * 0.5) var(--spacing);
      }
      button, select {
        font-size: 0.75rem;
        padding: 0.375rem 0.75rem;
      }
      #editor, #output {
        font-size: 0.8rem;
      }
    }
  .sample-dropdown {
      position: relative;
    }

    .sample-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 0.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0;
      list-style: none;
      min-width: 200px;
      z-index: 10;
      display: none;
    }

    .sample-menu[aria-hidden="false"] {
      display: block;
    }

    .sample-menu button {
      display: block;
      width: 100%;
      padding: 0.5rem 1rem;
      text-align: left;
      border: none;
      background: none;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }

    .sample-menu button:hover {
      background: var(--bg);
    }

    .sample-menu button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
</style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%2358a6ff%22/%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%20font-size%3D%2220%22%20font-weight%3D%22bold%22%3Esg%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a href="#editor" class="skip-link" id="skipLink">Skip to editor</a>

  <header>
    <div class="header-content">
      <h1 class="logo">self<span>grow</span></h1>
      <nav aria-label="Primary">
        <a href="#playground" style="margin-right: var(--spacing);">Playground</a>
        <a href="reference.html" style="margin-right: var(--spacing);">Reference</a>
        <a href="syntax.html">Syntax</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="playground" class="playground" aria-labelledby="playground-heading">
      <h2 id="playground-heading" class="sr-only">Playground</h2>

      <div class="pane">
        <div class="pane-header">Editor</div>
        <div class="pane-content">
          <div class="editor-wrapper">
            <div id="highlightOverlay" aria-hidden="true"></div>
            <textarea
              id="editor"
              tabindex="0"
              spellcheck="false"
              aria-label="Code editor — write selfgrow programs here"
              placeholder="// Try: 1 + 2&#10;// Or define a function:&#10;// fn add(a, b) = a + b&#10;// add(3, 4)"
            >1 + 2</textarea>
          </div>
        </div>
        <div class="controls">
          <button id="runBtn" class="primary" type="button" aria-keyshortcuts="Enter">Run (Enter)</button>
          <button id="clearBtn" type="button" aria-keyshortcuts="Escape">Clear (Escape)</button>
          <div class="sample-dropdown">
            <button id="sampleBtn" type="button" aria-haspopup="true" aria-controls="sampleMenu" aria-expanded="false" aria-label="Load sample program">
              — Load Sample —
            </button>
            <div id="sampleMenu" class="sample-menu" role="menu" aria-hidden="true" aria-labelledby="sampleBtn">
              <!-- Sample buttons will be inserted here by JavaScript -->
            </div>
          </div>
          <span class="sr-only" role="alert" id="runStatus"></span>
        </div>
      </div>

      <div class="pane">
        <div class="pane-header">Output</div>
        <div class="pane-content">
          <pre id="output" aria-live="polite" aria-atomic="true" tabindex="0" role="region" aria-label="Program output"></pre>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>selfgrow — a self-growing functional language. Examples are tests. No build step.</p>
  </footer>

  <script type="module" src="./playground.js"></script>
</body>
</html>

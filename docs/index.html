<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>selfgrow — an 8-bit idle game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── 8-bit Palette ─── */
    :root {
      --bg: #0a0a0f;
      --panel-bg: #16162a;
      --panel-border: #ff6b35;
      --accent: #ffd700;
      --text: #e0e0e0;
      --text-dim: #8888aa;
      --highlight: #00ff88;
      --pixel-font: 'Press Start 2P', 'Courier New', monospace;
      --border-width: 4px;
      --panel-pad: 1.5rem;
    }

    html {
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--pixel-font);
      min-height: 100dvh;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1rem;
      gap: 1.5rem;
    }

    /* ─── Panel — chunky bordered box ─── */
    .panel {
      background: var(--panel-bg);
      border: var(--border-width) solid var(--panel-border);
      padding: var(--panel-pad);
      width: 100%;
      max-width: 640px;
      image-rendering: pixelated;
    }

    /* "Scanline" texture via repeating gradient */
    .panel::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.015) 2px,
        rgba(255,255,255,0.015) 4px
      );
    }

    .panel {
      position: relative;
    }

    /* ─── Status bar ─── */
    #status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    #status-bar .stat {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    #status-bar .stat-label {
      font-size: 0.5rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #status-bar .stat-value {
      font-size: 0.85rem;
      color: var(--highlight);
    }

    .game-title {
      font-size: 0.6rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* ─── Action area ─── */
    #action-area {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    #action-area h2 {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .btn {
      font-family: var(--pixel-font);
      font-size: 0.55rem;
      color: var(--bg);
      background: var(--accent);
      border: 3px solid #b8960f;
      padding: 0.85rem 2rem;
      min-height: 40px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      image-rendering: pixelated;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:hover,
    .btn:focus-visible {
      background: #ffe44d;
      outline: 2px solid var(--highlight);
      outline-offset: 3px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:focus:not(:focus-visible) {
      outline: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn:disabled:hover {
      background: var(--accent);
      outline: none;
    }

    /* ─── Goal panel ─── */
    #goal-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #goal-panel .goal-label {
      font-size: 0.5rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #goal-text {
      font-size: 0.55rem;
      color: var(--text);
    }

    .progress-track {
      width: 100%;
      height: 1.2rem;
      background: #0a0a1a;
      border: 3px solid #3a3a5a;
      image-rendering: pixelated;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--highlight);
      transition: width 0.15s step-end;
      width: 0%;
    }

    /* ─── Offline summary overlay ─── */
    #offline-summary {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #offline-summary[hidden] {
      display: none;
    }

    .offline-panel {
      background: var(--panel-bg);
      border: var(--border-width) solid var(--panel-border);
      padding: var(--panel-pad);
      max-width: 480px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
      min-height: 220px;
    }

    .offline-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.015) 2px,
        rgba(255,255,255,0.015) 4px
      );
    }

    .offline-title {
      font-size: 0.55rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .offline-message {
      font-size: 0.5rem;
      color: var(--text);
      line-height: 1.8;
    }

    .offline-wood-highlight {
      color: var(--highlight);
      font-size: 0.65rem;
    }

    .btn-dismiss {
      font-family: var(--pixel-font);
      font-size: 0.5rem;
      color: var(--bg);
      background: var(--panel-border);
      border: 3px solid #cc4a1a;
      padding: 0.6rem 1.5rem;
      min-height: 40px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      align-self: center;
      transition: background 0.1s;
    }

    .btn-dismiss:hover,
    .btn-dismiss:focus-visible {
      background: #ff6b35;
      outline: 2px solid var(--highlight);
      outline-offset: 3px;
    }

    /* ─── Footer / status text ─── */
    .footer-note {
      font-size: 0.4rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }

    /* ─── Responsive: single column on narrow viewports ─── */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
        gap: 1rem;
      }

      :root {
        --panel-pad: 1rem;
      }

      #status-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      #status-bar .stat {
        width: 100%;
      }

      .game-title {
        font-size: 0.5rem;
      }

      #status-bar .stat-value {
        font-size: 0.7rem;
      }

      .btn {
        width: 100%;
        text-align: center;
        padding: 0.7rem 1rem;
      }

      .offline-panel {
        min-height: 200px;
        padding: 0.75rem;
      }

      .offline-message {
        font-size: 0.45rem;
      }
    }

    /* ─── Responsive: multi-column on wide viewports ─── */
    @media (min-width: 900px) {
      body {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 1.5rem;
        gap: 1.5rem;
      }

      .panel {
        max-width: none;
        flex: 1 1 280px;
      }

      #status-bar {
        flex: 0 0 100%;
      }
    }

    /* ─── Accessible: prefers-reduced-motion ─── */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
      .btn:active {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <!-- ═══ Status Bar Panel ═══ -->
  <section class="panel" id="status-bar" role="region" aria-label="Game status">
    <div class="game-title" aria-hidden="true">selfgrow</div>
    <div class="stat">
      <span class="stat-label" id="wood-label">Wood</span>
      <span class="stat-value" id="wood-value" aria-labelledby="wood-label">0</span>
    </div>
    <div class="stat">
      <span class="stat-label" id="rate-label">Rate</span>
      <span class="stat-value" id="rate-value" aria-labelledby="rate-label">0.1/s</span>
    </div>
    <div class="stat">
      <span class="stat-label" id="tick-label">Tick</span>
      <span class="stat-value" id="tick-value" aria-labelledby="tick-label">—</span>
    </div>
    <div class="stat" id="stone-stat" hidden>
      <span class="stat-label" id="stone-label">Stone</span>
      <span class="stat-value" id="stone-value" aria-labelledby="stone-label">0</span>
    </div>
    <div class="stat" id="stone-rate-stat" hidden>
      <span class="stat-label" id="stone-rate-label">Stone Rate</span>
      <span class="stat-value" id="stone-rate-value" aria-labelledby="stone-rate-label">0/s</span>
    </div>
  </section>

  <!-- ═══ Action Area Panel ═══ -->
  <section class="panel" id="action-area" role="region" aria-label="Actions">
    <h2>Actions</h2>
    <button class="btn" id="btn-gather" type="button" aria-label="Gather Wood">
      &#x26A0; Gather Wood
    </button>
    <button class="btn" id="btn-sharpen" type="button" aria-label="Sharpen Axe" hidden>
      &#x2692; Sharpen Axe (5 wood)
    </button>
    <button class="btn" id="btn-gather-stone" type="button" aria-label="Gather Stone" hidden>
      &#x26AA; Gather Stone
    </button>
    <button class="btn" id="btn-build-wall" type="button" aria-label="Build Wall" hidden>
      &#x1F3F0; Build Wall (5 stone)
    </button>
    <span class="footer-note" aria-live="polite">
      Click to gather wood. More actions appear as the world expands.
    </span>
  </section>

  <!-- ═══ Goal Panel ═══ -->
  <section class="panel" id="goal-panel" role="region" aria-label="Current goal">
    <div class="goal-label" id="goal-label">Next Goal</div>
    <div id="goal-text">Gather 10 wood</div>
    <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="10" aria-labelledby="goal-label">
      <div class="progress-fill" id="goal-progress-fill" style="width: 0%;"></div>
    </div>
  </section>

  <!-- ═══ Offline Summary Overlay ═══ -->
  <div id="offline-summary" hidden role="dialog" aria-modal="true" aria-labelledby="offline-title">
    <div class="offline-panel" tabindex="-1">
      <div class="offline-title" id="offline-title">Welcome Back</div>
      <div class="offline-message">
        While you were away, you gathered<br>
        <span class="offline-wood-highlight" id="offline-wood-amount">0</span> wood
      </div>
      <button class="btn-dismiss" id="btn-dismiss-offline" type="button">
        OK
      </button>
    </div>
  </div>

  <!-- ═══ Engine + live UI render loop ═══ -->
  <script type="module">
    import "./webmcp.js";
    import { init, getState, gatherWood, gatherStone, craftUpgrade, buildWall, consumeOfflineWoodGained, UPGRADE_COST, STONE_UPGRADE_COST } from "./engine.js";

    init();

    const stateEl = document.getElementById("wood-value");
    const rateEl = document.getElementById("rate-value");
    const tickEl = document.getElementById("tick-value");
    const stoneEl = document.getElementById("stone-value");
    const stoneRateEl = document.getElementById("stone-rate-value");
    const stoneStat = document.getElementById("stone-stat");
    const stoneRateStat = document.getElementById("stone-rate-stat");
    const btnGather = document.getElementById("btn-gather");
    const btnSharpen = document.getElementById("btn-sharpen");
    const btnGatherStone = document.getElementById("btn-gather-stone");
    const btnBuildWall = document.getElementById("btn-build-wall");
    const goalText = document.getElementById("goal-text");
    const goalFill = document.getElementById("goal-progress-fill");
    const goalProgress = document.getElementById("goal-panel").querySelector(".progress-track");
    const offlineSummary = document.getElementById("offline-summary");
    const offlineAmount = document.getElementById("offline-wood-amount");
    const btnDismiss = document.getElementById("btn-dismiss-offline");

    const GOAL_WOOD = 10;
    let goalReached = false;
    let stoneUnlocked = false;
    let wallBuilt = false;

    // ─── Cooldown state ───
    let cooldown = false;
    let stoneCooldown = false;
    const COOLDOWN_MS = 500;

    function setCooldown() {
      cooldown = true;
      btnGather.disabled = true;
      setTimeout(() => {
        cooldown = false;
        btnGather.disabled = false;
      }, COOLDOWN_MS);
    }

    function setStoneCooldown() {
      stoneCooldown = true;
      btnGatherStone.disabled = true;
      setTimeout(() => {
        stoneCooldown = false;
        btnGatherStone.disabled = false;
      }, COOLDOWN_MS);
    }

    function handleGather() {
      if (cooldown) return;
      gatherWood();
      setCooldown();
      renderUI();
    }

    btnGather.addEventListener("click", handleGather);
    btnGather.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleGather();
      }
    });

    function handleSharpen() {
      craftUpgrade();
      renderUI();
    }

    btnSharpen.addEventListener("click", handleSharpen);
    btnSharpen.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleSharpen();
      }
    });

    function handleGatherStone() {
      if (stoneCooldown) return;
      gatherStone();
      setStoneCooldown();
      renderUI();
    }

    btnGatherStone.addEventListener("click", handleGatherStone);
    btnGatherStone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleGatherStone();
      }
    });

    function handleBuildWall() {
      buildWall();
      renderUI();
    }

    btnBuildWall.addEventListener("click", handleBuildWall);
    btnBuildWall.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleBuildWall();
      }
    });

    // ─── Offline summary ───
    function showOfflineSummary() {
      const gained = consumeOfflineWoodGained();
      if (gained > 0) {
        offlineAmount.textContent = gained >= 1 ? Math.floor(gained) : gained.toFixed(1);
        offlineSummary.hidden = false;
        offlineSummary.querySelector(".offline-panel").focus();

        // Disable action buttons while overlay is visible so no click
        // can reach them through the covering overlay.
        btnGather.disabled = true;
        btnSharpen.disabled = true;
        if (btnGatherStone) btnGatherStone.disabled = true;
        if (btnBuildWall) btnBuildWall.disabled = true;

        // Seal the body against pointer events — the overlay is the only
        // interactive layer. The overlay itself keeps pointer-events: auto
        // so its dismiss button remains clickable.
        document.body.style.pointerEvents = "none";
        offlineSummary.style.pointerEvents = "auto";

        // Force flex display so the overlay is visible even in edge cases
        // where the hidden attribute removal doesn't trigger the CSS.
        offlineSummary.style.display = "flex";
      }
    }

    function dismissOffline() {
      offlineSummary.hidden = true;
      offlineSummary.style.display = ""; // clear inline display override

      // Re-enable all action buttons
      btnGather.disabled = false;
      btnSharpen.disabled = false;
      btnGatherStone.disabled = false;
      btnBuildWall.disabled = false;
      document.body.style.pointerEvents = "";
      offlineSummary.style.pointerEvents = "";
    }

    btnDismiss.addEventListener("click", dismissOffline);
    btnDismiss.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        dismissOffline();
      }
    });

    // Allow Escape to dismiss
    offlineSummary.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        dismissOffline();
      }
    });

    // ─── Render ───
    function renderUI() {
      const s = getState();
      const wood = s.wood;
      const stone = s.stone;

      // Wood count
      if (stateEl) {
        stateEl.textContent = Number.isInteger(wood) || wood >= 10
          ? String(Math.floor(wood))
          : wood.toFixed(2);
      }

      // Rate
      if (rateEl) {
        rateEl.textContent = s.rate.toFixed(2) + "/s";
      }

      // Tick indicator
      if (tickEl) {
        tickEl.textContent = "\u25B6";
      }

      // Stone display (unlocked after first sharpen upgrade)
      if (s.upgradeLevel >= 1 && !stoneUnlocked) {
        stoneUnlocked = true;
        stoneStat.hidden = false;
        stoneRateStat.hidden = false;
        btnGatherStone.hidden = false;
        btnGatherStone.disabled = false;
      }

      if (stoneEl) {
        stoneEl.textContent = Number.isInteger(stone) || stone >= 10
          ? String(Math.floor(stone))
          : stone.toFixed(2);
      }

      if (stoneRateEl) {
        stoneRateEl.textContent = s.stoneRate.toFixed(2) + "/s";
      }

      // Build Wall button (show when stone >= 5, or after wall is built)
      if (stoneUnlocked) {
        if (s.wallLevel <= 0) {
          btnBuildWall.hidden = stone < STONE_UPGRADE_COST;
        } else {
          btnBuildWall.hidden = true;
        }
        btnBuildWall.disabled = stone < STONE_UPGRADE_COST;
      }

      // Goal
      if (wood >= GOAL_WOOD) {
        if (!goalReached) {
          goalReached = true;
          // Show the sharpen button forever once unlocked
          btnSharpen.hidden = false;
        }

        if (stoneUnlocked && s.wallLevel <= 0) {
          // Stone goal: gather 5 stone then build a wall
          if (stone < STONE_UPGRADE_COST) {
            const pct = (stone / STONE_UPGRADE_COST) * 100;
            goalText.textContent = "Gather " + STONE_UPGRADE_COST + " stone";
            if (goalFill) goalFill.style.width = Math.min(pct, 100) + "%";
            if (goalProgress) goalProgress.setAttribute("aria-valuenow", Math.floor(stone));
            if (goalProgress) goalProgress.setAttribute("aria-valuemax", STONE_UPGRADE_COST);
          } else {
            goalText.textContent = "Build a Wall (" + STONE_UPGRADE_COST + " stone)";
            const pct = (stone / STONE_UPGRADE_COST) * 100;
            if (goalFill) goalFill.style.width = Math.min(pct, 100) + "%";
            if (goalProgress) goalProgress.setAttribute("aria-valuenow", Math.floor(stone));
            if (goalProgress) goalProgress.setAttribute("aria-valuemax", STONE_UPGRADE_COST);
          }
        } else {
          // Show upgrade goal: gather wood to craft the next sharpening
          const woodForUpgrade = wood;
          const pct = (woodForUpgrade / UPGRADE_COST) * 100;
          goalText.textContent = "Craft a Sharpening (" + UPGRADE_COST + " wood)";
          if (goalFill) goalFill.style.width = Math.min(pct, 100) + "%";
          if (goalProgress) goalProgress.setAttribute("aria-valuenow", Math.floor(woodForUpgrade % UPGRADE_COST));
          if (goalProgress) goalProgress.setAttribute("aria-valuemax", UPGRADE_COST);

          // Disable sharpen if not enough wood, enable otherwise
          btnSharpen.disabled = wood < UPGRADE_COST;
        }
      } else {
        goalReached = false;
        const pct = (wood / GOAL_WOOD) * 100;
        if (goalFill) goalFill.style.width = Math.min(pct, 100) + "%";
        if (goalProgress) goalProgress.setAttribute("aria-valuenow", Math.floor(wood));
        if (goalProgress) goalProgress.setAttribute("aria-valuemax", GOAL_WOOD);
        goalText.textContent = "Gather " + GOAL_WOOD + " wood";

        // Hide sharpen button until goal is reached
        btnSharpen.hidden = true;
        btnSharpen.disabled = false;
      }
    }

    // Show offline summary on load if there's offline wood
    showOfflineSummary();

    renderUI();
    setInterval(renderUI, 500);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>selfgrow — a living garden</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1a1a2e; color: #d4d4dc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #garden-canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #garden-canvas-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Sidebar: garden state panel */
    #state-panel {
      width: 280px;
      background: #23233a;
      border-left: 1px solid #3a3a5a;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #state-panel h1 {
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #b8b8d0;
      border-bottom: 1px solid #3a3a5a;
      padding-bottom: 0.75rem;
    }

    #state-panel h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7a7a9a;
      margin-top: 0.25rem;
    }

    #state-panel p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #c0c0d8;
    }

    .state-section {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .state-value {
      font-size: 0.95rem;
      color: #e0e0f0;
    }

    .state-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9090b0;
    }

    /* Focus indicator for keyboard users */
    #state-panel:focus {
      outline: 2px solid #6a6aee;
      outline-offset: -2px;
    }

    /* Skip link — always reachable by pointer at top-left, collapsed to 1px when not focused */
    .skip-link {
      position: absolute;
      top: 0;
      left: 0;
      background: #5a5add;
      color: #fff;
      padding: 0 1rem;
      z-index: 1000;
      font-size: 0.9rem;
      border-radius: 0 0 4px 0;
      text-decoration: none;
      height: 1px;
      overflow: hidden;
      white-space: nowrap;
    }
    .skip-link:hover,
    .skip-link:focus,
    .skip-link:active {
      height: auto;
      padding: 0.5rem 1rem;
      overflow: visible;
      white-space: normal;
    }

    /* Flash animation for skip-to-garden-state focus confirmation (closes #612) */
    @keyframes flash-border {
      0%   { border-bottom-color: #6a6aee; }
      70%  { border-bottom-color: #6a6aee; }
      100% { border-bottom-color: #3a3a5a; }
    }

    #state-panel.flash-active h1 {
      animation: flash-border 1s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      #state-panel.flash-active h1 {
        animation: none;
        border-bottom-color: #6a6aee;
      }
    }

    @media (max-width: 640px) {
      #app {
        flex-direction: column;
      }
      #state-panel {
        width: 100%;
        height: 48%;
        border-left: none;
        border-top: 1px solid #3a3a5a;
      }
      #state-panel:focus {
        outline: 3px solid #6a6aee;
        outline-offset: -3px;
      }
      #garden-canvas-wrapper {
        height: 60%;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#state-panel">Skip to garden state</a>

  <div id="app" role="application" aria-label="selfgrow garden">
    <div id="garden-canvas-wrapper" role="presentation">
      <!-- Three.js canvas renders here -->
    </div>

    <aside id="state-panel" tabindex="0" role="region" aria-label="Garden state">
      <h1>selfgrow</h1>

      <div class="state-section">
        <span class="state-label">Season</span>
        <span class="state-value" id="season-display">Spring</span>
      </div>

      <div class="state-section">
        <span class="state-label">Time of day</span>
        <span class="state-value" id="time-display">Morning</span>
      </div>

      <div class="state-section">
        <span class="state-label">Weather</span>
        <span class="state-value" id="weather-display">Clear</span>
      </div>

      <div class="state-section">
        <span class="state-label">Growing</span>
        <p id="growing-description">Nothing yet — the soil is waiting.</p>
      </div>

      <div class="state-section">
        <span class="state-label">Plot</span>
        <p id="plot-description" tabindex="0">An empty plot of rich soil, ready for something to grow.</p>
      </div>

      <div class="state-section">
        <span class="state-label">Acknowledgment</span>
        <span class="state-value" id="garden-state-acknowledgment" aria-live="polite"></span>
      </div>

      <div class="state-section">
        <span class="state-label">Visit</span>
        <span class="state-value" id="visit-display"></span>
      </div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.170.0",
      "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { initGarden, startSeasonalCycle, createFallenLeaves, createGroundDetails, getGroundWarmBaseline } from "./garden.js";
    import { createAmbientParticles } from "./particles.js";
    import { createGroundNoiseTexture, createGroundAlphaMap } from "./groundNoise.js";
    import { createHorizon } from "./horizon.js";
    import { createScrub } from "./scrub.js";
    import { startDayNightCycle, createInitialSkyGradient } from "./daynight.js";
    import { startWeatherCycle } from "./weather.js";
    import { loadGardenState, saveGardenState, fastForwardState, clearGardenState, SEASON_CYCLE_DURATION_MS } from "./persistence.js";
    import { createRain } from "./rain.js";
    import { createStars } from "./stars.js";
    import { createGroundRipple, computeDisplacement } from "./groundRipple.js";
    import { createCreature } from "./creature.js";
    import { createAmbientAudio } from "./ambientAudio.js";
    import { createFireflies } from "./fireflies.js";
    import { createDawnMist } from "./dawnMist.js";
    import { createBeetle } from "./beetle.js";
    import { createCondensation } from "./condensation.js";
    /* Registers the tools in agenttools.js with the browser's agent API. */
    import "./webmcp.js";

    const wrapper = document.getElementById('garden-canvas-wrapper');
    const scene = new THREE.Scene();
    /* Vertical gradient sky: lighter near horizon, deeper overhead (issue #801) */
    scene.background = createInitialSkyGradient(new THREE.Color(0x87ceeb));

    const camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 100);
    camera.position.set(4, 3, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.5;
    wrapper.prepend(renderer.domElement);

    /* Ambient light — soft fill */
    const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambientLight);

    /* Directional light — sun source, casts shadows */
    const sunLight = new THREE.DirectionalLight(0xffeedd, 1.6);
    sunLight.position.set(5, 10, 4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.1;
    sunLight.shadow.camera.far = 20;
    sunLight.shadow.camera.left = -7;
    sunLight.shadow.camera.right = 7;
    sunLight.shadow.camera.top = 7;
    sunLight.shadow.camera.bottom = -7;
    scene.add(sunLight);

    /* Secondary fill light from opposite side */
    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    /* Ground plane — rich soil with subtle procedural noise texture
     * and radial alpha fade at the outer edge for a natural transition
     * into the scene background. */
    const groundGeo = new THREE.CircleGeometry(5.5, 48);
    const groundNoiseTexture = createGroundNoiseTexture();
    const groundAlphaMap = createGroundAlphaMap();
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x4a3728,
      map: groundNoiseTexture,
      alphaMap: groundAlphaMap,
      transparent: true,
      roughness: 0.9,
      metalness: 0.0,
      side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    /* A subtle ring around the plot */
    const ringGeo = new THREE.RingGeometry(5.2, 5.8, 48);
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x5a4a38,
      roughness: 0.8,
      metalness: 0.0,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.3
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.0;
    scene.add(ring);

    /* Hemisphere light for sky/ground colour separation */
    const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x4a3728, 0.5);
    scene.add(hemiLight);

    /* Organic perimeter detail ring — replaces the removed GridHelper.
       Small, irregularly spaced grass tufts (cones) and moss hummocks
       (hemispheres) around the ground perimeter, creating a natural garden-bed
       boundary instead of a diagram-like grid. Static placement so
       prefers-reduced-motion is automatically respected. */
    const perimeterGroup = new THREE.Group();
    perimeterGroup.name = 'perimeter-detail';

    const grassColor = new THREE.Color(0x5a7a3a);
    const mossColor = new THREE.Color(0x6a6a3a);
    const grassMat = new THREE.MeshStandardMaterial({ color: grassColor, roughness: 0.9, metalness: 0 });
    const mossMat = new THREE.MeshStandardMaterial({ color: mossColor, roughness: 0.95, metalness: 0 });

    const coneGeo = new THREE.ConeGeometry(0.04, 0.08, 5);
    const sphereGeo = new THREE.SphereGeometry(0.04, 6, 4);

    const NUM_GRASS = 35;
    const NUM_MOSS = 22;
    const MIN_RADIUS = 5.2;
    const MAX_RADIUS = 5.4;

    function randomAngle() {
      return Math.random() * Math.PI * 2;
    }

    function randomRadius() {
      return MIN_RADIUS + Math.random() * (MAX_RADIUS - MIN_RADIUS);
    }

    function randomScale() {
      return 0.6 + Math.random() * 0.8;
    }

    /* Grass tufts (cones) */
    for (let i = 0; i < NUM_GRASS; i++) {
      const angle = randomAngle();
      const r = randomRadius();
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const scale = randomScale();
      const grass = new THREE.Mesh(coneGeo, grassMat);
      grass.position.set(x, 0.0, z);
      grass.scale.set(scale, scale, scale);
      grass.rotation.y = Math.random() * Math.PI * 2;
      /* Slight random tilt so they don't all stand perfectly upright */
      grass.rotation.x = (Math.random() - 0.5) * 0.3;
      grass.rotation.z = (Math.random() - 0.5) * 0.3;
      perimeterGroup.add(grass);
    }

    /* Moss hummocks (hemispheres) — slightly flatter spheres */
    for (let i = 0; i < NUM_MOSS; i++) {
      const angle = randomAngle();
      const r = randomRadius();
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const scale = randomScale() * 0.8;
      const moss = new THREE.Mesh(sphereGeo, mossMat);
      moss.position.set(x, 0.0, z);
      moss.scale.set(scale, scale * 0.5, scale);
      moss.rotation.y = Math.random() * Math.PI * 2;
      perimeterGroup.add(moss);
    }

    scene.add(perimeterGroup);

    /* Click handler so pointer clicks (not just keyboard tab) work
       - Prevent default hash jump
       - Focus the state panel so screen readers announce it
       - Add a brief 1s border flash on the h1 for visible confirmation (closes #612)
       - On mobile (≤640px), scroll to bring the panel to the top of the viewport */
    document.querySelector('.skip-link').addEventListener('click', function(e) {
      e.preventDefault();
      const panel = document.getElementById('state-panel');
      if (panel) {
        panel.focus();

        /* Flash the header border to confirm focus transfer (issue #612) */
        panel.classList.add('flash-active');
        setTimeout(function() {
          panel.classList.remove('flash-active');
        }, 1000);

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isMobile = window.innerWidth <= 640;
        panel.scrollIntoView({
          behavior: reducedMotion ? 'auto' : 'smooth',
          block: isMobile ? 'start' : 'nearest'
        });
      }
    });

    /* --- OrbitControls with smooth damping --- */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minPolarAngle = 0.1;          // never fully top-down
    controls.maxPolarAngle = Math.PI / 2.3; // never below the ground plane
    controls.minDistance = 2.0;            // prevent zooming too close — keep plants in context
    controls.maxDistance = 15;             // prevent zooming too far — horizon and scrub remain visible
    controls.target.set(0, 0.4, 0);        // aim at the seedling's height
    controls.rotateSpeed = 0.5;            // unhurried, botanical pace
    controls.update();

    /* --- Camera stillness tracking for user-acknowledgment (issue #544) --- */
    const ACKNOWLEDGMENT_SENTENCES = [
      'You pause to look, and the garden feels still around you.',
      'Your presence settles into the quiet of the garden.',
      'The garden acknowledges your patient gaze.',
      'Stillness passes between you and the garden.',
      'You breathe, and the garden seems to breathe with you.'
    ];

    const ACKNOWLEDGMENT_COOLDOWN_MS = 60_000;
    const STILLNESS_THRESHOLD_MS = 15_000;

    let lastInteractionTime = performance.now();
    let lastAcknowledgmentTime = 0;

    /* --- Periodic visitor presence acknowledgment (issue #596) --- */
    const PRESENCE_PHRASES = [
      'The garden is aware of your quiet presence.',
      'You sit with the garden in shared stillness.',
      'The garden holds space for your attention.',
      'Watching the garden, time moves at its own pace.',
      'The garden rests calmly in your awareness.'
    ];

    let lastPresencePhraseIndex = -1;

    /* Fallback phrases — used when a transition acknowledgment expires
     * so the acknowledgment section never displays blank text (issue #815). */
    const FALLBACK_PHRASES = [
      'The garden continues its quiet rhythm.',
      'Stillness settles over the garden once more.',
      'The garden rests in patient silence.',
      'Calm returns to the garden as it awaits your attention.'
    ];

    let _fallbackPhraseLastTwo = [];

    function pickFallbackPhrase() {
      var available = FALLBACK_PHRASES.filter(function(phrase) {
        return _fallbackPhraseLastTwo.indexOf(phrase) === -1;
      });
      if (available.length === 0) {
        /* All phrases have been used in the last 2 picks — reset tracking
         * to allow any phrase to be used again. */
        _fallbackPhraseLastTwo = [];
        available = FALLBACK_PHRASES.slice();
      }
      var picked = available[Math.floor(Math.random() * available.length)];
      _fallbackPhraseLastTwo.push(picked);
      if (_fallbackPhraseLastTwo.length > 2) {
        _fallbackPhraseLastTwo.shift();
      }
      return picked;
    }

    function setAcknowledgment(text) {
      const ackEl = document.getElementById('garden-state-acknowledgment');
      if (ackEl) {
        ackEl.textContent = text;
      }
    }

    function pickPresencePhrase() {
      let idx;
      do {
        idx = Math.floor(Math.random() * PRESENCE_PHRASES.length);
      } while (idx === lastPresencePhraseIndex && PRESENCE_PHRASES.length > 1);
      lastPresencePhraseIndex = idx;
      return PRESENCE_PHRASES[idx];
    }

    function scheduleNextPresenceCheck() {
      const delay = 30000 + Math.random() * 30000; // 30-60 seconds
      setTimeout(function checkPresence() {
        const now = performance.now();
        const timeSinceLastAck = now - lastAcknowledgmentTime;
        // Only update if enough time has passed since last acknowledgment
        // (whether from camera stillness or a previous presence check)
        if (timeSinceLastAck >= 25000) {
          lastAcknowledgmentTime = now;
          setAcknowledgment(pickPresencePhrase());
        }
        scheduleNextPresenceCheck();
      }, delay);
    }

    function getReducedMotionPref() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    controls.addEventListener('change', function onControlsChange() {
      creature.notifyCameraMoved();
      if (getReducedMotionPref()) return;

      const now = performance.now();
      const idleDuration = now - lastInteractionTime;
      const timeSinceLastAck = now - lastAcknowledgmentTime;

      if (idleDuration >= STILLNESS_THRESHOLD_MS && timeSinceLastAck >= ACKNOWLEDGMENT_COOLDOWN_MS) {
        lastAcknowledgmentTime = now;
        const sentence = ACKNOWLEDGMENT_SENTENCES[Math.floor(Math.random() * ACKNOWLEDGMENT_SENTENCES.length)];
        setAcknowledgment(sentence);
      }

      lastInteractionTime = now;
    });

    /* --- Distant horizon tree-line silhouette --- */
    const horizon = createHorizon(scene);

    /* --- Mid-ground scrub/bush silhouettes --- */
    const scrub = createScrub(scene);

    /* Resize handler */
    function onResize() {
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    /* --- Ambient floating particles (dust motes / pollen) --- */
    const particles = createAmbientParticles(scene);

    /* --- Rain particle system (visible during Light Drizzle) --- */
    const rain = createRain(scene);
    rain.update(0, 0.016); // initialise to safe state

    /* --- Star field (visible only during Night phase) --- */
    const stars = createStars(scene);
    stars.update(0, 0.016); // initialise to safe state

    /* --- Subtle ground ripple suggesting moving air --- */
    const groundRipple = createGroundRipple(ground);

    /* --- Drifting creature at the scene periphery --- */
    const creature = createCreature(scene);

    /* --- Firefly glow dots near plants during Night phase --- */
    const fireflies = createFireflies(scene);

    /* --- Tiny ground beetle near plant stems during warm conditions (issue #766) --- */
    const beetle = createBeetle(scene);

    /* --- Dawn mist: subtle ground-level mist during early Morning (issue #747) --- */
    const dawnMist = createDawnMist(scene);

    /* --- Dawn condensation: transient moisture beads and wet carapace sheen (issue #773) --- */
    const condensation = createCondensation();

    /* Animation loop */
    let animTime = 0;
    let lastFrameTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastFrameTime) / 1000, 0.05); // cap dt to avoid spiral
      lastFrameTime = now;

      animTime += dt;
      controls.update();
      particles.update(animTime);

      /* Update rain: pass absolute time and delta time */
      rain.update(animTime, dt);

      /* Update ground ripple animation */
      groundRipple.update(animTime);

      /* Update fallen leaves to respond to ground ripple */
      const fallenLeaves = window.__gardenState && window.__gardenState.fallenLeaves;
      if (fallenLeaves && typeof fallenLeaves.update === 'function') {
        fallenLeaves.update(animTime, computeDisplacement);
      }

      /* Update ground seeds to respond to ground ripple */
      const groundSeeds = window.__gardenState && window.__gardenState.groundSeeds;
      if (groundSeeds && typeof groundSeeds.update === 'function') {
        groundSeeds.update(animTime, computeDisplacement);
      }

      /* Update creature position */
      creature.update(animTime);

      /* Update star field */
      stars.update(animTime, dt);

      /* Update firefly glow dots */
      fireflies.update(animTime, dt);

      /* Update dawn mist (issue #747) */
      dawnMist.update(animTime);

      /* Update dawn condensation beads and carapace sheen (issue #773) */
      condensation.update();

      /* Update ground beetle (issue #766) */
      beetle.update(animTime);

      /* Update distant horizon/scrub silhouettes with the flat sky colour
       * (the gradient texture is not a Color, so read from dayNightState). */
      var _dayNight = window.__gardenState && window.__gardenState.dayNight;
      if (_dayNight && typeof _dayNight.getSkyColor === 'function') {
        var _skyColor = _dayNight.getSkyColor();
        horizon.update(_skyColor);
        scrub.update(_skyColor);
      }

      renderer.render(scene, camera);
    }

    animate();

    /* Update plot description to reflect the drifting haze */
    const plotDesc = document.getElementById('plot-description');
    if (plotDesc && plotDesc.textContent === 'An empty plot of rich soil, ready for something to grow.') {
      plotDesc.textContent = 'An empty plot of rich soil, ready for something to grow. A faint haze drifts in the air.';
    }

    /* Time-of-day-aware description contexts (issue #493).
     * Each phase provides a sentence that weaves atmospheric context into
     * the plot and growing descriptions without replacing the base text,
     * composing with weather and butterfly layers.
     */
    const TIME_OF_DAY_CONTEXTS = {
      'Morning': [
        'Soft awakening light spreads across the garden, the air gentle and warm.',
        'A gentle morning light reaches across the garden, carrying the quiet warmth of dawn.',
        'The first soft light of day settles into the garden, bringing a calm warmth.',
        'Pale morning light spreads through the garden, the air carrying a quiet freshness.',
        'The garden receives the first light of day, soft and gentle across the leaves and soil.',
        'The morning light filters through the leaves, casting soft shadows across the dew-covered ground.',
        'Dawn\'s pale glow spreads slowly across the garden, the air cool and full of the scent of waking earth.',
        'A soft golden light climbs the stems and leaves, the garden emerging gently from the night\'s cool.',
        'The first rays touch the highest leaves, the garden bathed in the quiet clarity of early morning.',
        'Morning spills softly into the garden, each dewdrop catching the pale light before it fades.'
      ],
      'Midday': [
        'Bright clear light fills the garden, the sun warm and steady overhead.',
        'The midday sun rests high overhead, its steady warmth filling the garden with light.',
        'Clear, bright light pours across the garden, the sun\'s warmth settled in the air.',
        'The sun stands high and still, its light falling straight and unwavering across the garden.',
        'Bright midday illumination fills the space between leaves, warm and unbroken by cloud.',
        'The midday sun holds the garden in a steady, warm light, shadows shrinking to dark pools at the base of each stem.',
        'The light is direct and unshadowed, the garden open and still under the high sun.',
        'Bright light fills every corner of the garden, the sun at its peak casting short, sharp shadows.',
        'The sun beats down evenly across the garden, the leaves absorbing the full warmth of midday.',
        'The garden is bathed in the unwavering light of midday, the air warm and the shadows few and brief.'
      ],
      'Evening': [
        'Golden tones settling across the garden as the light mellows toward dusk.',
        'Warm golden light softens across the garden, fading gently toward evening.',
        'The light turns golden and low, casting long shadows across the quiet garden.',
        'The light shifts toward amber, lengthening shadows stretching across the garden floor.',
        'Evening colour deepens in the garden, the warm glow slowly giving way to dusk.',
        'The lowering sun washes the garden in warm amber tones, the day releasing its last light.',
        'Long shadows reach across the garden as the sun sinks, the light softening to a gentle gold.',
        'The garden catches the last warmth of the day as the sun dips lower, colour deepening in the west.',
        'Golden light pools in the hollows of the garden, the day slowly unwinding into evening.',
        'A rich amber glow settles across the leaves as the sun descends, the garden hushing into dusk.'
      ],
      'Night': [
        'Darkness and deep quiet hold the garden, lit by stars and firefly glow.',
        'The garden rests in deep darkness, lit only by distant stars and small glimmers.',
        'Quiet night holds the garden, the darkness lit by scattered starlight and tiny firefly sparks.',
        'The garden is wrapped in night\'s quiet darkness, the only light the faint shimmer of stars above.',

          if (!syncCounts[s.groupIndex]) {

          syncCounts[s.groupIndex].total++;
          if (s.syncActive) syncCounts[s.groupIndex].synced++;

          visitEl.textContent = 'First visit';
        } else {
          visitEl.textContent = 'Visit #' + window.__gardenState.visitCount;
        }
      }
    }

    /* Create fallen leaves that respond to the seasonal cycle */
    createFallenLeaves(scene);

    /* Scatter ground detail: stones and moss patches */
    createGroundDetails(scene);

    startSeasonalCycle(initial ? initial.seasonProgress : undefined);

    /* --- Returning-visitor ground warmth pulse on page load (issue #754) ---
     * When visitCount >= 2, the ground centre briefly pulses a subtle warm tone:
     *   - Ramp 0→1 over 0.5s (lerping ~8% toward 0x6a5a3a)
     *   - Hold at 1 for 1s
     *   - Decay 1→0 over 1.5s
     * Under prefers-reduced-motion, a static ~3% warmth is applied for the session.
     * The _groundWarmPulse value is read by garden.js's startSeasonalCycle tick
     * and composed additively with the seasonal colour. */
    if (window.__gardenState.visitCount >= 2) {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reducedMotion) {
        // Static ~3% warmth (0.375 * 0.08 = 0.03 = 3%) — persists for the session
        window.__gardenState._groundWarmPulse = 0.375;
      } else {
        // Animated pulse: ramp 0→1 over 0.5s, hold 1s, decay 1→0 over 1.5s
        const pulseStartTime = performance.now();
        const RAMP_DURATION = 500;
        const HOLD_DURATION = 1000;
        const DECAY_DURATION = 1500;
        const TOTAL_DURATION = RAMP_DURATION + HOLD_DURATION + DECAY_DURATION;

        function pulseTick() {
          const elapsed = performance.now() - pulseStartTime;
          let value = 0;

          if (elapsed < RAMP_DURATION) {
            // Ramp 0→1 over 0.5s with ease-out
            const t = elapsed / RAMP_DURATION;
            value = 1 - Math.pow(1 - t, 3);
          } else if (elapsed < RAMP_DURATION + HOLD_DURATION) {
            // Hold at 1 for 1s
            value = 1;
          } else if (elapsed < TOTAL_DURATION) {
            // Decay 1→0 over 1.5s with ease-out cubic
            const t = (elapsed - RAMP_DURATION - HOLD_DURATION) / DECAY_DURATION;
            value = Math.pow(1 - t, 3);
          }

          window.__gardenState._groundWarmPulse = Math.max(0, Math.min(1, value));

          if (elapsed < TOTAL_DURATION) {
            requestAnimationFrame(pulseTick);
          } else {
            window.__gardenState._groundWarmPulse = 0;
          }
        }

        requestAnimationFrame(pulseTick);
      }
    }

    startDayNightCycle(sunLight, scene, ambientLight, hemiLight, fillLight, initial ? initial.dayNightProgress : undefined);
    startWeatherCycle(sunLight, scene, ambientLight, hemiLight, fillLight, particles, initial ? initial.weatherProgress : undefined);

    /* --- Ambient audio: wind and rain soundscape --- */
    const ambientAudio = createAmbientAudio();

    /* Expose audio state for selftest */
    window.__gardenState.ambientAudio = ambientAudio;

    /* Resume AudioContext on first user interaction (click/tap) */
    const resumeAudio = () => {
      ambientAudio.resumeOnInteraction();
      document.removeEventListener('click', resumeAudio);
      document.removeEventListener('touchstart', resumeAudio);
    };
    document.addEventListener('click', resumeAudio);
    document.addEventListener('touchstart', resumeAudio);

    /* Poll the weather phase, time-of-day and season every ~1s and update audio character.
     * Triggers when ANY of weather, time or season changes.
     * Season composes on top of time-of-day and weather (mirroring description composition).
     */
    let lastAudioWeather = '';
    let lastAudioTime = '';
    let lastAudioSeason = '';
    function updateAudioWeather() {
      const weatherPhase = document.getElementById('weather-display')?.textContent?.trim() || '';
      const timeOfDay = document.getElementById('time-display')?.textContent?.trim() || '';
      const season = document.getElementById('season-display')?.textContent?.trim() || '';
      if ((weatherPhase !== lastAudioWeather || timeOfDay !== lastAudioTime || season !== lastAudioSeason) && weatherPhase) {
        lastAudioWeather = weatherPhase;
        lastAudioTime = timeOfDay;
        lastAudioSeason = season;
        ambientAudio.update(weatherPhase, timeOfDay, season);
      }
    }

    /* Check weather on a regular interval (smooth transitions are handled by setTargetAtTime) */
    setInterval(updateAudioWeather, 1000);

    /* Poll the weather and time displays every ~1s and update butterfly description */
    setInterval(updateButterflyDescription, 1000);

    /* Poll the weather display every ~1s and update weather-aware descriptions */
    setInterval(updateWeatherDescription, 1000);

    /* Poll the time display every ~1s and update time-of-day-aware descriptions */
    setInterval(updateTimeOfDayDescription, 1000);

    /* Poll the season display every ~1s and update season-aware descriptions */
    setInterval(updateSeasonDescription, 1000);

    /* Poll the firefly sync state every ~1s and update sync description during Night */
    setInterval(updateFireflySyncDescription, 1000);

    /* Poll the firefly pollination bias state every ~1s and update bias description during Night (issue #692) */
    setInterval(updateFireflyPollinationBiasDescription, 1000);

    /* Poll the leaf tremble state every ~500ms and update leaf-tremble description (issue #675) */
    setInterval(updateLeafTrembleDescription, 500);

    /* --- Periodic garden-history phrase in plot description (issue #790) ---
     * Every 90-120 seconds, picks a phrase from a small pool that references
     * the garden's accumulated visit count. The phrase is composed into the
     * plot description alongside existing weather/time/season context layers.
     * Does not fire within 5s of page load, or within 30s of a camera interaction.
     * On camera interaction, the timer resets (defers the next phrase by 30s).
     * The pool avoids repeating the last-chosen phrase. */
    const HISTORY_PHRASES = [
      (n) => 'The soil here has warmed through ' + n + ' return visits.',
      (n) => 'This garden has seen ' + n + ' seasons turn.',
      (n) => 'The stems carry the memory of ' + n + ' visits.',
      (n) => 'The garden remembers ' + n + ' returns.',
      (n) => 'The quiet growth holds the trace of ' + n + ' visits.',
      (n) => n + ' visits have passed through this garden\'s stillness.'
    ];

    let _historyUpdateTimer = null;
    let _currentHistoryPhrase = '';
    let _lastHistoryPhraseIndex = -1;
    const HISTORY_UPDATE_GRACE_MS = 5000;
    const HISTORY_CAMERA_COOLDOWN_MS = 30000;
    const HISTORY_UPDATE_MIN_MS = 90000;
    const HISTORY_UPDATE_MAX_MS = 120000;
    let _historyUpdatePageLoaded = false;

    setTimeout(function() { _historyUpdatePageLoaded = true; }, HISTORY_UPDATE_GRACE_MS);

    function updateHistoryDescription() {
      /* Respect page-load grace period */
      if (!_historyUpdatePageLoaded) {
        scheduleHistoryDescriptionUpdate();
        return;
      }

      /* Respect camera-interaction cooldown */
      var now = performance.now();
      if (now - lastInteractionTime < HISTORY_CAMERA_COOLDOWN_MS) {
        scheduleHistoryDescriptionUpdate();
        return;
      }

      var plotEl = document.getElementById('plot-description');
      if (!plotEl) {
        scheduleHistoryDescriptionUpdate();
        return;
      }

      /* Pick a new phrase, avoiding repetition of the last one */
      var idx;
      do {
        idx = Math.floor(Math.random() * HISTORY_PHRASES.length);
      } while (idx === _lastHistoryPhraseIndex && HISTORY_PHRASES.length > 1);
      _lastHistoryPhraseIndex = idx;

      var visitCount = window.__gardenState.visitCount || 1;
      var newPhrase = HISTORY_PHRASES[idx](visitCount);

      /* Strip old history phrase from current plot description */
      var currentText = plotEl.textContent;
      var base;
      if (_currentHistoryPhrase && currentText.indexOf(_currentHistoryPhrase) !== -1) {
        base = currentText.replace(_currentHistoryPhrase, '').replace(/\s+/g, ' ').trim();
      } else {
        base = currentText;
      }

      /* Compose: existing description + new history phrase */
      plotEl.textContent = base + ' ' + newPhrase;
      _currentHistoryPhrase = newPhrase;

      scheduleHistoryDescriptionUpdate();
    }

    function scheduleHistoryDescriptionUpdate() {
      if (_historyUpdateTimer) {
        clearTimeout(_historyUpdateTimer);
      }
      var delay = HISTORY_UPDATE_MIN_MS + Math.random() * (HISTORY_UPDATE_MAX_MS - HISTORY_UPDATE_MIN_MS);
      _historyUpdateTimer = setTimeout(updateHistoryDescription, delay);
    }

    /* Start the history phrase updater after initial page set-up */
    scheduleHistoryDescriptionUpdate();

    /* Reset the history timer on camera interaction so a cooldown starts fresh */
    controls.addEventListener('start', function onCameraInteraction() {
      if (_historyUpdateTimer) {
        clearTimeout(_historyUpdateTimer);
        _historyUpdateTimer = null;
      }
      /* Schedule a new update after the cooldown + random delay */
      var delay = HISTORY_CAMERA_COOLDOWN_MS + HISTORY_UPDATE_MIN_MS + Math.random() * (HISTORY_UPDATE_MAX_MS - HISTORY_UPDATE_MIN_MS);
      _historyUpdateTimer = setTimeout(updateHistoryDescription, delay);
    });

    /* --- Periodic visitor presence acknowledgment (issue #596):
     * Runs a randomized timer (30-60s delay) that picks a phrase
     * from PRESENCE_PHRASES, avoiding repetition of the last phrase.
     * Shares lastAcknowledgmentTime with the camera-stillness mechanism
     * so the two cannot fire too close together. --- */
    scheduleNextPresenceCheck();

    /* --- Environmental phase transition acknowledgment (issue #802) ---
     * When the day phase, weather, or season transitions to a new state,
     * inject a brief transition acknowledgment into #garden-state-acknowledgment.
     * The transition text persists for ~10s then reverts to normal acknowledgment cycling.
     * Each transition type draws from a small pool of 3-4 variants so the same
     * event phrase does not repeat identically within 3 occurrences. */

    /* Transition phrase pools: keyed by "OldPhase→NewPhase" */
    const DAY_TRANSITION_PHRASES = {
      'Morning→Midday': [
        'Morning fills the garden, the light climbing across the leaves.',
        'The morning light strengthens, shadows shortening as the sun climbs higher.',
        'The light grows bolder as morning gives way to midday.',
        'Morning deepens toward noon, the sun rising steadily above the garden.'
      ],
      'Midday→Evening': [
        'The sun begins its descent, golden tones creeping into the afternoon light.',
        'Midday mellows as the sun arcs westward, warmth settling deep in the soil.',
        'The afternoon light softens, the first hints of evening colour touching the leaves.',
        'The bright noon light fades as the sun sinks toward the treeline.'
      ],
      'Evening→Night': [
        'Dusk gathers as the last sunlight drains from the garden, stars emerging overhead.',
        'Evening slips into night as the sky deepens to indigo and the first stars appear.',
        'The warm colours of dusk give way to darkness, the garden settling into night.',
        'The garden fades into twilight as the stars take possession of the sky.'
      ],
      'Night→Morning': [
        'The eastern sky pales — dawn breaks over the garden, the night receding softly.',
        'Night loosens its hold as pale morning light seeps across the horizon.',
        'First light touches the highest leaves as the garden stirs from darkness.',
        'The stars dim one by one as a soft glow rises in the east, heralding morning.'
      ]
    };

    const WEATHER_TRANSITION_PHRASES = {
      'Clear→Overcast': [
        'The air shifts as clouds gather overhead, the light turning soft and grey.',
        'A veil of cloud draws across the sky, muting the sunlight to a gentle grey.',
        'Clouds knit together overhead, the garden sinking into a quiet, shadowless light.',
        'The sky pales as cloud cover thickens, softening every edge and shadow.'
      ],
      'Overcast→Light Drizzle': [
        'A fine rain begins to fall, pattering softly on the leaves.',
        'The grey sky releases a gentle rain, each droplet trembling on the foliage.',
        'The first drops descend from the overcast sky, the garden sighing under the rain.',
        'Thin strands of rain begin to drift down, the air cooling with the falling water.'
      ],
      'Light Drizzle→Clear': [
        'The rain thins and stops, the clouds parting to let the sun through.',
        'The last droplets fall as the grey curtain lifts, sunlight breaking across the garden.',
        'The drizzle fades, the clouds dispersing as clear light sweeps back over the garden.',
        'The rain ceases and the sky clears, warm light returning to the rain-washed leaves.'
      ]
    };

    const SEASON_TRANSITION_PHRASES = {
      'Spring→Summer': [
        'The air warms as spring ripens into summer, the garden filling with dense green growth.',
        'Spring deepens toward summer, the leaves broadening under a strengthening sun.',
        'The garden sheds the last traces of spring coolness as summer verdure takes hold.',
        'The light turns rich and warm as the season shifts from spring to summer.'
      ],
      'Summer→Autumn': [
        'A change touches the air as summer edges toward autumn, gold and amber seeping into the leaves.',
        'The first hints of autumn colour appear among the green as the warmth of summer fades.',
        'Summer relinquishes its hold as the garden begins its slow turn toward autumn.',
        'The light takes on a golden quality as summer gives way to the turning season.'
      ],
      'Autumn→Winter': [
        'The last leaves fall as autumn gives way to winter, the air turning sharp and still.',
        'Cold settles into the garden as autumn surrenders to winter, bare branches etched against the sky.',
        'A deep stillness descends as autumn fades and winter claims the garden.',
        'The garden strips down to its bones as winter follows autumn, frost tracing across every surface.'
      ],
      'Winter→Spring': [
        'A subtle warmth returns to the air as winter loosens its grip and the first hints of spring appear.',
        'The frost recedes as winter turns toward spring, the soil beginning to stir beneath the surface.',
        'The first pale shoots push through the soil as winter gives way to the renewal of spring.',
        'The garden stirs from its winter sleep as the air softens and the light gains strength.'
      ]
    };

    const TRANSITION_PHRASE_POOLS = {
      day: DAY_TRANSITION_PHRASES,
      weather: WEATHER_TRANSITION_PHRASES,
      season: SEASON_TRANSITION_PHRASES
    };

    /* Track recent phrases per transition key: Map<key, string[]> of last 3 used */
    const _recentTransitionPhrases = new Map();

    function pickTransitionPhrase(transitionKey, pool) {
      const variants = pool[transitionKey];
      if (!variants || variants.length === 0) return null;

      const used = _recentTransitionPhrases.get(transitionKey) || [];
      const recentSet = new Set(used);

      /* Find a variant not in the recent 3; if all have been used recently, pick the least recent */
      let available = variants.filter(function(v) { return !recentSet.has(v); });
      if (available.length === 0) {
        available = variants;
      }

      const picked = available[Math.floor(Math.random() * available.length)];

      /* Update recent list: keep last 3 */
      used.push(picked);
      if (used.length > 3) used.shift();
      _recentTransitionPhrases.set(transitionKey, used);

      return picked;
    }

    let _transitionTimer = null;
    let _transitionFallbackTimer = null;
    let _lastTransitionTime = 0;
    const TRANSITION_ACK_DURATION_MS = 10000;

    function injectTransitionAcknowledgment(text) {
      if (_transitionTimer) {
        clearTimeout(_transitionTimer);
        _transitionTimer = null;
      }
      if (_transitionFallbackTimer) {
        clearTimeout(_transitionFallbackTimer);
        _transitionFallbackTimer = null;
      }

      _lastTransitionTime = performance.now();
      setAcknowledgment(text);

      _transitionTimer = setTimeout(function() {
        _transitionTimer = null;
        /* Instead of clearing to empty string (which leaves the acknowledgment
         * section blank for 30-60s until the next presence check), set a brief
         * fallback phrase from a small pool (issue #815). */
        var fallback = pickFallbackPhrase();
        setAcknowledgment(fallback);

        /* Schedule a one-shot presence check 8-12s later to replace the
         * fallback with a fresh presence phrase, then resume normal cycling. */
        var oneShotDelay = 8000 + Math.random() * 4000;
        _transitionFallbackTimer = setTimeout(function() {
          _transitionFallbackTimer = null;
          lastAcknowledgmentTime = performance.now();
          setAcknowledgment(pickPresencePhrase());
          /* scheduleNextPresenceCheck is already running from initialization,
           * so normal presence cycling resumes from here. */
        }, oneShotDelay);
      }, TRANSITION_ACK_DURATION_MS);
    }

    /* Suppress transition detection during the first 1s after page load so the
     * initial greeting is not overwritten. */
    let _pageLoadGrace = true;
    setTimeout(function() { _pageLoadGrace = false; }, 1000);

    /* Known phase values for each display. We track the last known so we can
     * detect transitions when a mutation fires. */
    let _lastTimePhase = (document.getElementById('time-display')?.textContent || '').trim();
    let _lastWeatherPhase = (document.getElementById('weather-display')?.textContent || '').trim();
    let _lastSeasonPhase = (document.getElementById('season-display')?.textContent || '').trim();

    const _transitionObserver = new MutationObserver(function(mutations) {
      if (_pageLoadGrace) return;

      for (let i = 0; i < mutations.length; i++) {
        const target = mutations[i].target;
        const currentText = (target.textContent || '').trim();

        if (target.id === 'time-display' && currentText !== _lastTimePhase) {
          const transitionKey = _lastTimePhase + '→' + currentText;
          const pool = DAY_TRANSITION_PHRASES;
          if (pool[transitionKey]) {
            const phrase = pickTransitionPhrase(transitionKey, pool);
            if (phrase) injectTransitionAcknowledgment(phrase);
          }
          _lastTimePhase = currentText;
        }

        if (target.id === 'weather-display' && currentText !== _lastWeatherPhase) {
          const transitionKey = _lastWeatherPhase + '→' + currentText;
          const pool = WEATHER_TRANSITION_PHRASES;
          if (pool[transitionKey]) {
            const phrase = pickTransitionPhrase(transitionKey, pool);
            if (phrase) injectTransitionAcknowledgment(phrase);
          }
          _lastWeatherPhase = currentText;
        }

        if (target.id === 'season-display' && currentText !== _lastSeasonPhase) {
          const transitionKey = _lastSeasonPhase + '→' + currentText;
          const pool = SEASON_TRANSITION_PHRASES;
          if (pool[transitionKey]) {
            const phrase = pickTransitionPhrase(transitionKey, pool);
            if (phrase) injectTransitionAcknowledgment(phrase);
          }
          _lastSeasonPhase = currentText;
        }
      }
    });

    _transitionObserver.observe(document.getElementById('time-display'), { childList: true, subtree: true, characterData: true });
    _transitionObserver.observe(document.getElementById('weather-display'), { childList: true, subtree: true, characterData: true });
    _transitionObserver.observe(document.getElementById('season-display'), { childList: true, subtree: true, characterData: true });

    /* Expose transition state on __gardenState for selftest verification */
    window.__gardenState.TRANSITION_PHRASE_POOLS = TRANSITION_PHRASE_POOLS;
    Object.defineProperty(window.__gardenState, '_lastTransitionTime', {
      get: function() { return _lastTransitionTime; },
      enumerable: true,
      configurable: true
    });
    window.__gardenState._recentTransitionPhrases = _recentTransitionPhrases;
    window.__gardenState._pickTransitionPhrase = pickTransitionPhrase;
    window.__gardenState._injectTransitionAcknowledgment = injectTransitionAcknowledgment;
    window.__gardenState.FALLBACK_PHRASES = FALLBACK_PHRASES;
    window.__gardenState.pickFallbackPhrase = pickFallbackPhrase;
    Object.defineProperty(window.__gardenState, '_pageLoadGrace', {
      get: function() { return _pageLoadGrace; },
      enumerable: true,
      configurable: true
    });

    /* --- Session elapsed-time acknowledgment (issue #804) ---
     * At four thresholds after page load (30s, 60s, 120s, 180s), inject a
     * session-duration phrase into the acknowledgment. Each threshold draws
     * from a small phrase pool of 3+ variants. Composes alongside existing
     * acknowledgment mechanisms (stillness, presence cycling, transition events)
     * without overriding them — defers if a transition acknowledgment was set
     * within the last 3s so transitions take priority. */

    const SESSION_TIME_PHRASES = {
      30000: [
        'You have been sitting with the garden for a little while.',
        'A short time has passed as the garden continues its quiet rhythm.',
        'The garden has noticed you staying a while.',
        'Moments drift by as you and the garden rest together.'
      ],
      60000: [
        'Time passes gently as you watch the garden.',
        'The garden has settled into your patient company.',
        'You have spent a quiet minute with the garden now.',
        'The garden keeps its calm pace, and you are still here with it.'
      ],
      120000: [
        'The garden has settled around your presence over these minutes.',
        'You have been here long enough that the garden feels familiar.',
        'The light and shadows have shifted while you watched the garden.',
        'Two minutes have passed in quiet companionship with the garden.'
      ],
      180000: [
        'The garden holds your presence like a part of its own stillness.',
        'Three minutes now, and the garden has woven itself into your awareness.',
        'You have become part of the garden\'s calm for these minutes.',
        'Time in the garden flows softly, and you have been here for several minutes.'
      ]
    };

    const SESSION_TIME_THRESHOLDS = [30000, 60000, 120000, 180000];
    let _sessionTimers = [];
    let _sessionTimePhrasesUsed = [];

    function _pickSessionPhrase(thresholdMs) {
      var pool = SESSION_TIME_PHRASES[thresholdMs];
      if (!pool || pool.length === 0) return null;
      var available = pool.filter(function(phrase) {
        return _sessionTimePhrasesUsed.indexOf(phrase) === -1;
      });
      if (available.length === 0) {
        // All used this session — reset tracking so we can repeat
        _sessionTimePhrasesUsed = [];
        available = pool.slice();
      }
      var picked = available[Math.floor(Math.random() * available.length)];
      _sessionTimePhrasesUsed.push(picked);
      return picked;
    }

    /* Start session timers immediately after page load. The page-load greeting
     * persists for at least 30s before the first session timer fires, so it
     * is never overwritten too early. */
    for (var ti = 0; ti < SESSION_TIME_THRESHOLDS.length; ti++) {
      (function(thresh) {
        var timerId = setTimeout(function fireSessionAcknowledgment() {
          var phrase = _pickSessionPhrase(thresh);
          if (!phrase) return;

          /* If a transition acknowledgment was set within the last 3s,
           * defer this session acknowledgment by 2s so transitions take priority. */
          var timeSinceTransition = performance.now() - _lastTransitionTime;
          if (timeSinceTransition < 3000) {
            var retryId = setTimeout(fireSessionAcknowledgment, 2000);
            _sessionTimers.push(retryId);
            return;
          }

          setAcknowledgment(phrase);
          lastAcknowledgmentTime = performance.now();
        }, thresh);
        _sessionTimers.push(timerId);
      })(SESSION_TIME_THRESHOLDS[ti]);
    }

    /* Expose session-time state on __gardenState for selftest verification */
    window.__gardenState.SESSION_TIME_PHRASES = SESSION_TIME_PHRASES;
    window.__gardenState._sessionTimers = _sessionTimers;
    window.__gardenState._sessionTimePhrasesUsed = _sessionTimePhrasesUsed;
    window.__gardenState._pickSessionPhrase = _pickSessionPhrase;

    /* Expose garden-history phrase updater state on __gardenState for selftest (issue #790) */
    window.__gardenState.HISTORY_PHRASES = HISTORY_PHRASES;
    window.__gardenState.updateHistoryDescription = updateHistoryDescription;
    window.__gardenState.scheduleHistoryDescriptionUpdate = scheduleHistoryDescriptionUpdate;

    /* --- Periodic save: every 2 seconds capture current state --- */
    setInterval(saveGardenState, 2000);

    /* Also save when the page is about to unload — and clear session timers
     * so no orphaned timer remains (issue #804). */
    window.addEventListener('beforeunload', function sessionCleanup() {
      saveGardenState();
      for (var ti = 0; ti < _sessionTimers.length; ti++) {
        clearTimeout(_sessionTimers[ti]);
      }
      _sessionTimers = [];
      if (_historyUpdateTimer) {
        clearTimeout(_historyUpdateTimer);
        _historyUpdateTimer = null;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference — selfgrow</title>
  <style>

    :root {
      --bg: #0d1117;
      --bg-elevated: #161b22;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --editor-bg: #0d1117;
      --output-bg: #0d1117;
      --error: #f85149;
      --success: #3fb950;
      --focus: #58a6ff;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --spacing: 1rem;
      --radius: 6px;
      --transition: 150ms ease;
      --header-height: 4rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    a:focus-visible,
    button:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Header */
    header {
      padding: var(--spacing) calc(var(--spacing) * 2);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing);
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent);
    }

    /* Main layout */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing) calc(var(--spacing) * 2);
      min-height: calc(100vh - 200px);
    }

    /* Playground */
    .playground {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing);
      margin-bottom: calc(var(--spacing) * 3);
    }

    @media (max-width: 900px) {
      .playground {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    .pane-header {
      padding: calc(var(--spacing) * 0.75) var(--spacing);
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg-muted);
      background: rgba(255,255,255,0.02);
    }

    .pane-content {
      flex: 1;
      padding: var(--spacing);
      overflow: auto;
    }

    /* Editor */
    .editor-wrapper {
      position: relative;
      flex: 1;
      min-height: 360px;
      background: var(--editor-bg);
    }

    #editor {
      width: 100%;
      height: 100%;
      min-height: 360px;
      background: transparent;
      color: var(--fg);
      border: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      tab-size: 2;
      padding: var(--spacing);
      position: relative;
      z-index: 1;
      overflow: auto;
      scrollbar-gutter: stable;
      white-space: pre;
    }

    #editor::placeholder {
      color: var(--fg-muted);
      opacity: 0.6;
    }

    #editor:focus {
      outline: none;
    }

    #highlightOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      tab-size: 2;
      padding: var(--spacing);
      overflow: auto;
      scrollbar-gutter: stable;
      white-space: pre;
      color: var(--fg);
    }

    /* Syntax token colours — dark theme */
    .tok-keyword { color: #ff7b72; }
    .tok-string { color: #a5d6ff; }
    .tok-number { color: #79c0ff; }
    .tok-boolean { color: #ff7b72; }
    .tok-identifier { color: #e6edf3; }
    .tok-operator { color: #d2a8ff; }
    .tok-punctuation { color: #8b949e; }

    /* Output */
    #output {
      background: var(--output-bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 360px;
    }

    #output:empty::before {
      content: "Output will appear here…";
      color: var(--fg-muted);
      opacity: 0.5;
    }

    .output-error {
      color: var(--error);
    }

    .output-value {
      color: var(--success);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: calc(var(--spacing) * 0.5);
      padding: calc(var(--spacing) * 0.75) var(--spacing);
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    button {
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }

    button:hover {
      background: var(--bg-elevated);
      border-color: var(--accent);
    }

    button:active {
      background: var(--border);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    select {
      font-family: var(--font-ui);
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    select:hover {
      border-color: var(--accent);
    }

    select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Reference section */
    .reference {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .reference-header {
      padding: var(--spacing);
      border-bottom: 1px solid var(--border);
      font-size: 1rem;
      font-weight: 600;
      background: rgba(255,255,255,0.02);
    }

    .reference-content {
      padding: var(--spacing);
      padding-top: calc(var(--header-height) + var(--spacing));
    }

    .capability-list {
      display: grid;
      gap: calc(var(--spacing) * 0.75);
    }

    .capability-item {
      padding: var(--spacing);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color var(--transition);
    }

    .capability-item:hover {
      border-color: var(--accent);
    }

    .capability-name {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    .capability-summary {
      font-size: 0.875rem;
      color: var(--fg-muted);
      margin-bottom: 0.5rem;
    }

    .capability-examples {
      display: grid;
      gap: 0.25rem;
    }

    .example {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .example-source {
      color: var(--fg);
      flex: 1;
      min-width: 200px;
    }

    .example-result {
      color: var(--success);
      white-space: nowrap;
    }

    .example-arrow {
      color: var(--fg-muted);
    }

    /* Footer */
    footer {
      padding: calc(var(--spacing) * 2);
      text-align: center;
      color: var(--fg-muted);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      margin-top: calc(var(--spacing) * 3);
    }

    /* Visually hidden for screen readers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: var(--bg);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      z-index: 100;
      transition: top var(--transition);
    }

    .skip-link:focus {
      top: var(--spacing);
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* High contrast mode support */
    @media (prefers-contrast: high) {
      :root {
        --border: #8b949e;
        --fg-muted: #c9d1d9;
      }
    }

    /* Test runner */
    .test-runner {
      margin-bottom: calc(var(--spacing) * 2);
    }

    #runAllTestsBtn {
      margin-bottom: var(--spacing);
    }

    #testSummary {
      scroll-margin-top: var(--header-height);
    }

    .test-summary {
      padding: var(--spacing);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: var(--spacing);
      font-size: 0.875rem;
      font-weight: 500;
      transition: border-color var(--transition), color var(--transition);
    }

    .test-summary.all-pass {
      border-color: var(--success);
      color: var(--success);
    }

    .test-summary.has-failures {
      border-color: var(--error);
      color: var(--error);
    }

    .test-results {
      display: grid;
      gap: var(--spacing);
    }

    .test-capability {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--spacing);
    }

    .test-capability-name {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .test-capability-section {
      margin-bottom: 0.75rem;
    }

    .test-capability-section:last-child {
      margin-bottom: 0;
    }

    .test-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fg-muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .test-example {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.25rem;
    }

    .test-example.pass {
      background: rgba(63, 185, 80, 0.1);
      color: var(--success);
    }

    .test-example.fail {
      background: rgba(248, 81, 73, 0.1);
      color: var(--error);
    }

    .test-example .test-icon {
      font-weight: bold;
      flex-shrink: 0;
    }

    .test-example .test-source {
      color: var(--fg);
    }

    .test-example .test-detail {
      color: var(--fg-muted);
      font-size: 0.75rem;
    }

    .test-properties {
      margin-top: 0.25rem;
    }

    .test-property {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.25rem;
    }

    .test-property.pass {
      background: rgba(63, 185, 80, 0.1);
      color: var(--success);
    }

    .test-property.fail {
      background: rgba(248, 81, 73, 0.1);
      color: var(--error);
    }

    .test-property .test-icon {
      font-weight: bold;
      flex-shrink: 0;
    }

    .test-property .test-message {
      color: var(--fg);
    }
    </style>

</head>
<body>
  <a href="#capabilityList" class="skip-link" id="skipLink">Skip to reference</a>

  <header>
    <div class="header-content">
      <h1 class="logo">self<span>grow</span></h1>
      <nav aria-label="Primary">
        <a href="index.html" style="margin-right: var(--spacing);">Playground</a>
        <a href="#reference" style="margin-right: var(--spacing);">Reference</a>
        <a href="syntax.html">Syntax</a>
      </nav>
    </div>
  </header>

  <main>
<section id="reference" class="reference" aria-labelledby="reference-heading">
      <h2 id="reference-heading" class="reference-header">Language Reference</h2>
      <div class="reference-content">
        <p style="color: var(--fg-muted); margin-bottom: var(--spacing);">
          Capabilities are listed below. Use the Run button on each example to test it live.
        </p>
        <div class="test-runner">
          <button id="runAllTestsBtn" type="button">Run all tests</button>
          <div id="testSummary" class="test-summary" aria-live="polite"></div>
          <div id="testResults" class="test-results"></div>
        </div>

        <div class="capability-list" id="capabilityList" role="list" aria-label="Language capabilities"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>selfgrow — a self-growing functional language. Examples are tests. No build step.</p>
  </footer>

  <script type="module">
    import { getAllMeta, getAllCapabilities } from './lang/capabilities/registry.js';
    import { run } from './lang/run.js';

    // --- Reference section rendering ---

    function renderReference() {
      const list = document.getElementById('capabilityList');
      if (!list) return;
      const placeholder = list.parentElement.querySelector('p');
      if (placeholder) placeholder.style.display = 'none';
      list.innerHTML = '';

      for (const meta of getAllMeta()) {
        if (!meta) continue;

        const item = document.createElement('div');
        item.className = 'capability-item';
        item.setAttribute('role', 'listitem');

        const nameEl = document.createElement('h3');
        nameEl.className = 'capability-name';
        nameEl.textContent = meta.name;
        item.appendChild(nameEl);

        const summaryEl = document.createElement('p');
        summaryEl.className = 'capability-summary';
        summaryEl.textContent = meta.summary;
        item.appendChild(summaryEl);

        if (meta.examples && meta.examples.length > 0) {
          const examplesEl = document.createElement('div');
          examplesEl.className = 'capability-examples';
          examplesEl.setAttribute('role', 'list');
          examplesEl.setAttribute('aria-label', `Examples for ${meta.name}`);

          meta.examples.forEach((example) => {
            const exampleEl = document.createElement('div');
            exampleEl.className = 'example';
            exampleEl.setAttribute('role', 'listitem');

            const sourceEl = document.createElement('code');
            sourceEl.className = 'example-source';
            sourceEl.textContent = example.source;
            exampleEl.appendChild(sourceEl);

            const arrowEl = document.createElement('span');
            arrowEl.className = 'example-arrow';
            arrowEl.textContent = '\u2192';
            arrowEl.setAttribute('aria-hidden', 'true');
            exampleEl.appendChild(arrowEl);

            const expectedEl = document.createElement('span');
            expectedEl.className = 'example-result';
            expectedEl.textContent = example.result;
            exampleEl.appendChild(expectedEl);

            const runBtn = document.createElement('button');
            runBtn.type = 'button';
            runBtn.textContent = 'Run';
            runBtn.setAttribute('aria-label', `Run example: ${example.source}`);

            const runResult = document.createElement('span');
            runResult.className = 'example-result';
            runResult.style.marginLeft = '0.5rem';
            runResult.setAttribute('aria-live', 'polite');

            runBtn.addEventListener('click', () => {
              runBtn.disabled = true;
              try {
                const actual = run(example.source);
                if (actual === example.result) {
                  runResult.textContent = `\u2713 ${actual}`;
                  runResult.style.color = '';
                } else {
                  runResult.textContent = `\u2717 expected "${example.result}", got "${actual}"`;
                  runResult.style.color = 'var(--error)';
                }
              } catch (err) {
                runResult.textContent = `\u2717 Error: ${err.message || String(err)}`;
                runResult.style.color = 'var(--error)';
              } finally {
                runBtn.disabled = false;
              }
            });

            exampleEl.appendChild(runBtn);
            exampleEl.appendChild(runResult);
            examplesEl.appendChild(exampleEl);
          });

          item.appendChild(examplesEl);
        }

        list.appendChild(item);
      }
    }

    // --- Test runner ---

    function runAllTests() {
      const summaryEl = document.getElementById('testSummary');
      const resultsEl = document.getElementById('testResults');
      const btn = document.getElementById('runAllTestsBtn');

      btn.disabled = true;
      summaryEl.textContent = 'Running tests…';
      summaryEl.className = 'test-summary';
      resultsEl.innerHTML = '';

      let totalExamples = 0;
      let passedExamples = 0;
      let failedExamples = 0;
      let totalPropertyFailures = 0;

      const capabilities = getAllCapabilities();
      const results = [];

      for (const cap of capabilities) {
        const capResult = {
          name: cap.meta.name,
          examples: [],
          propertyFailures: [],
        };

        // Run each example
        if (cap.meta.examples) {
          for (const example of cap.meta.examples) {
            totalExamples++;
            const exampleResult = {
              source: example.source,
              expected: example.result,
              actual: null,
              passed: false,
              error: null,
            };

            try {
              const actual = run(example.source);
              exampleResult.actual = actual;
              exampleResult.passed = actual === example.result;
              if (exampleResult.passed) {
                passedExamples++;
              } else {
                failedExamples++;
              }
            } catch (err) {
              exampleResult.error = err.message || String(err);
              failedExamples++;
            }

            capResult.examples.push(exampleResult);
          }
        }

        // Check properties
        try {
          const failures = cap.checkFn(run);
          capResult.propertyFailures = Array.isArray(failures) ? failures : [];
          totalPropertyFailures += capResult.propertyFailures.length;
        } catch (err) {
          capResult.propertyFailures = [`checkProperties threw: ${err.message || String(err)}`];
          totalPropertyFailures += capResult.propertyFailures.length;
        }

        results.push(capResult);
      }

      // Render summary
      const allPassed = failedExamples === 0 && totalPropertyFailures === 0;
      summaryEl.textContent = `${passedExamples}/${totalExamples} examples passed, ${totalPropertyFailures} property failure${totalPropertyFailures !== 1 ? 's' : ''}`;
      summaryEl.className = 'test-summary ' + (allPassed ? 'all-pass' : 'has-failures');

      // Render per-capability results
      for (const capResult of results) {
        const capEl = document.createElement('div');
        capEl.className = 'test-capability';

        const nameEl = document.createElement('h3');
        nameEl.className = 'test-capability-name';
        nameEl.textContent = capResult.name;
        capEl.appendChild(nameEl);

        // Examples section
        if (capResult.examples.length > 0) {
          const examplesSection = document.createElement('div');
          examplesSection.className = 'test-capability-section';

          const examplesTitle = document.createElement('div');
          examplesTitle.className = 'test-section-title';
          examplesTitle.textContent = 'Examples';
          examplesSection.appendChild(examplesTitle);

          for (const ex of capResult.examples) {
            const exEl = document.createElement('div');
            exEl.className = 'test-example ' + (ex.passed ? 'pass' : 'fail');

            const icon = document.createElement('span');
            icon.className = 'test-icon';
            icon.textContent = ex.passed ? '\u2713' : '\u2717';
            icon.setAttribute('aria-hidden', 'true');
            exEl.appendChild(icon);

            const source = document.createElement('span');
            source.className = 'test-source';
            source.textContent = ex.source;
            exEl.appendChild(source);

            if (!ex.passed) {
              const detail = document.createElement('span');
              detail.className = 'test-detail';
              if (ex.error) {
                detail.textContent = `Error: ${ex.error}`;
              } else {
                detail.textContent = `expected "${ex.expected}", got "${ex.actual}"`;
              }
              exEl.appendChild(detail);
            }

            examplesSection.appendChild(exEl);
          }

          capEl.appendChild(examplesSection);
        }

        // Properties section
        const propsSection = document.createElement('div');
        propsSection.className = 'test-capability-section';

        const propsTitle = document.createElement('div');
        propsTitle.className = 'test-section-title';
        propsTitle.textContent = 'Property checks';
        propsSection.appendChild(propsTitle);

        if (capResult.propertyFailures.length > 0) {
          for (const failure of capResult.propertyFailures) {
            const propEl = document.createElement('div');
            propEl.className = 'test-property fail';

            const icon = document.createElement('span');
            icon.className = 'test-icon';
            icon.textContent = '\u2717';
            icon.setAttribute('aria-hidden', 'true');
            propEl.appendChild(icon);

            const msg = document.createElement('span');
            msg.className = 'test-message';
            msg.textContent = failure;
            propEl.appendChild(msg);

            propsSection.appendChild(propEl);
          }
        } else {
          const propEl = document.createElement('div');
          propEl.className = 'test-property pass';

          const icon = document.createElement('span');
          icon.className = 'test-icon';
          icon.textContent = '\u2713';
          icon.setAttribute('aria-hidden', 'true');
          propEl.appendChild(icon);

          const msg = document.createElement('span');
          msg.className = 'test-message';
          msg.textContent = 'All properties hold';
          propEl.appendChild(msg);

          propsSection.appendChild(propEl);
        }

        capEl.appendChild(propsSection);
        resultsEl.appendChild(capEl);
      }

      btn.disabled = false;
    }

    document.getElementById('runAllTestsBtn').addEventListener('click', runAllTests);

    renderReference();
  
  </script>
</body>
</html>
